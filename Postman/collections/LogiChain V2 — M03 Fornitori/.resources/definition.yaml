$kind: collection
description: |-
  Collection di test per la Milestone M03 — Anagrafiche "I nostri Fornitori" (backend).

  COME USARLA:
  1) Avvia il backend (npm run dev) con DB migrato e seedato (seed_ruoli_permessi + seed_admin).
  2) PREREQUISITO ECOSYSTEM — inserisci un fornitore source=ecosystem e copia il suo id nella variabile {{fornitore_eco_id}}:
     INSERT INTO fornitori (ragione_sociale, piva, email, source) VALUES ('Ecosistema Srl', '99999999999', 'eco@test.it', 'ecosystem');
     SELECT id FROM fornitori WHERE piva = '99999999999';
  3) Esegui prima la cartella "0. Setup" (crea utenti di test e popola i token).
  4) Esegui la cartella "Fornitori" IN ORDINE (i test condividono lo stato: 02 salva {{fornitore_id}}).

  Suggerimento: usa il Collection Runner mantenendo l'ordine. Le credenziali admin di default sono quelle del .env.example; modifica le variabili se nel tuo .env sono diverse.
variables:
  base_url: http://localhost:3000
  admin_email: admin@logichain.it
  admin_password: Admin123!
  resp_acquisti_email: resp.acquisti@logichain.it
  resp_acquisti_password: Test1234!
  operatore_email: operatore@logichain.it
  operatore_password: Test1234!
  resp_magazzino_email: resp.magazzino@logichain.it
  resp_magazzino_password: Test1234!
  token_admin: ""
  token_resp_acquisti: ""
  token_no_access: ""
  token_resp_magazzino: ""
  fornitore_id: ""
  fornitore_eco_id: ""
