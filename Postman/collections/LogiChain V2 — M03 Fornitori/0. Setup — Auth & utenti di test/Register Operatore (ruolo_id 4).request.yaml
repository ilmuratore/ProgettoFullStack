$kind: http-request
url: "{{base_url}}/api/v1/auth/register"
method: POST
headers:
  Authorization: Bearer {{token_admin}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nome": "Op",
      "cognome": "Eratore",
      "email": "{{operatore_email}}",
      "password": "{{operatore_password}}",
      "ruolo_id": 4
    }
scripts:
  - type: afterResponse
    code: pm.test('Register 201 oppure 409 (utente già esistente)', () => pm.expect([201, 409]).to.include(pm.response.code));
    language: text/javascript
order: 3000
