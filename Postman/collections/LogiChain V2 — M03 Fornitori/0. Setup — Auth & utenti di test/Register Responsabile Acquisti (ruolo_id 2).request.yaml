$kind: http-request
url: "{{base_url}}/api/v1/auth/register"
method: POST
headers:
  Authorization: Bearer {{token_admin}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nome": "Resp",
      "cognome": "Acquisti",
      "email": "{{resp_acquisti_email}}",
      "password": "{{resp_acquisti_password}}",
      "ruolo_id": 2
    }
scripts:
  - type: afterResponse
    code: pm.test('Register 201 oppure 409 (utente già esistente)', () => pm.expect([201, 409]).to.include(pm.response.code));
    language: text/javascript
order: 2000
