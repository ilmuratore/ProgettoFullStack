$kind: http-request
url: "{{base_url}}/api/v1/auth/register"
method: POST
headers:
  Authorization: Bearer {{token_admin}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nome": "Resp",
      "cognome": "Magazzino",
      "email": "{{resp_magazzino_email}}",
      "password": "{{resp_magazzino_password}}",
      "ruolo_id": 3
    }
scripts:
  - type: afterResponse
    code: pm.test('Register 201 oppure 409 (utente già esistente)', () => pm.expect([201, 409]).to.include(pm.response.code));
    language: text/javascript
order: 4000
