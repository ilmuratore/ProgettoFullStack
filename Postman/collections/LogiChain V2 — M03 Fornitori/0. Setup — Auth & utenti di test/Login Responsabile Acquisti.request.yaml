$kind: http-request
url: "{{base_url}}/api/v1/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{resp_acquisti_email}}",
      "password": "{{resp_acquisti_password}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Login 200', () => pm.response.to.have.status(200));
      const t = pm.response.json().data.token;
      pm.expect(t, 'token presente').to.be.a('string');
      pm.collectionVariables.set('token_resp_acquisti', t);
    language: text/javascript
order: 5000
