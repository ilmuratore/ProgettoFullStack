$kind: http-request
name: 06 GET id inesistente -> 404
url: "{{base_url}}/api/v1/fornitori/999999"
method: GET
headers:
  Authorization: Bearer {{token_admin}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 404', () => pm.response.to.have.status(404));
      pm.test('code = RESOURCE_NOT_FOUND', () => pm.expect(pm.response.json().code).to.eql('RESOURCE_NOT_FOUND'));
    language: text/javascript
order: 6000
