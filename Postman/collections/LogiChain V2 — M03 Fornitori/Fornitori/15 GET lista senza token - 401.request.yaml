$kind: http-request
name: 15 GET lista senza token -> 401
url: "{{base_url}}/api/v1/fornitori"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 401', () => pm.response.to.have.status(401));
      pm.test('code = AUTH_REQUIRED', () => pm.expect(pm.response.json().code).to.eql('AUTH_REQUIRED'));
    language: text/javascript
order: 15000
