$kind: http-request
name: 16 POST con token Operatore -> 403
url: "{{base_url}}/api/v1/fornitori"
method: POST
headers:
  Authorization: Bearer {{token_no_access}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "ragione_sociale": "X",
      "piva": "22222222222"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 403', () => pm.response.to.have.status(403));
      pm.test('code = ACCESS_DENIED', () => pm.expect(pm.response.json().code).to.eql('ACCESS_DENIED'));
    language: text/javascript
order: 16000
