$kind: http-request
name: 18 DELETE con token Operatore -> 403
url: "{{base_url}}/api/v1/fornitori/{{fornitore_id}}"
method: DELETE
headers:
  Authorization: Bearer {{token_no_access}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 403', () => pm.response.to.have.status(403));
      pm.test('code = ACCESS_DENIED', () => pm.expect(pm.response.json().code).to.eql('ACCESS_DENIED'));
    language: text/javascript
order: 18000
