$kind: http-request
url: "{{base_url}}/api/v1/fornitori"
method: POST
headers:
  Authorization: Bearer {{token_admin}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "ragione_sociale": "Test",
      "piva": "11111111111",
      "source": "ecosystem"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 201', () => pm.response.to.have.status(201));
      pm.test("source dal body ignorato -> 'manual'", () => pm.expect(pm.response.json().data.source).to.eql('manual'));
    language: text/javascript
order: 3000
