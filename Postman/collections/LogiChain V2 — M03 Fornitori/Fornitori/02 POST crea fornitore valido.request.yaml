$kind: http-request
url: "{{base_url}}/api/v1/fornitori"
method: POST
headers:
  Authorization: Bearer {{token_admin}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "ragione_sociale": "Acme Srl",
      "piva": "12345678901",
      "email": "info@acme.it"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 201', () => pm.response.to.have.status(201));
      const f = pm.response.json().data;
      pm.test("source = 'manual'", () => pm.expect(f.source).to.eql('manual'));
      pm.collectionVariables.set('fornitore_id', f.id);
    language: text/javascript
order: 2000
