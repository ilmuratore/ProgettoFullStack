$kind: http-request
url: "{{base_url}}/api/v1/fornitori/{{fornitore_id}}"
method: GET
headers:
  Authorization: Bearer {{token_admin}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      const f = pm.response.json().data;
      pm.test("source = 'manual'", () => pm.expect(f.source).to.eql('manual'));
      pm.test('campi base presenti', () => ['id','ragione_sociale','piva','source'].forEach(k => pm.expect(f).to.have.property(k)));
    language: text/javascript
order: 5000
