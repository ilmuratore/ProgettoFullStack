$kind: http-request
url: "{{baseUrl}}/api/v1/auth/register"
method: POST
headers:
  Authorization: Bearer {{token_admin}}
body:
  type: json
  content: |-
    {
      "nome": "Cor",
      "cognome": "Riere",
      "email": "{{corriereEmail}}",
      "password": "{{corrierePassword}}",
      "ruolo_id": 5
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Registra Corriere -> 201 o 409 (gia esistente)', function () {
        pm.expect([201, 409]).to.include(pm.response.code);
      });
    language: text/javascript
order: 3000
