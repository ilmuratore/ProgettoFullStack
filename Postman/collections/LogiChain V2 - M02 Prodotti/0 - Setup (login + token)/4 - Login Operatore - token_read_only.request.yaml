$kind: http-request
name: 4 - Login Operatore -> token_read_only
url: "{{baseUrl}}/api/v1/auth/login"
method: POST
body:
  type: json
  content: |-
    {
      "email": "{{operatorEmail}}",
      "password": "{{operatorPassword}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      var b = pm.response.json();
      pm.test('Login Operatore -> 200', function () { pm.response.to.have.status(200); });
      if (b.data && b.data.token) { pm.collectionVariables.set('token_read_only', b.data.token); }
    language: text/javascript
order: 4000
