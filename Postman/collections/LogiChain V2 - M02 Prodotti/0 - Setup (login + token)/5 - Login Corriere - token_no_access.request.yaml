$kind: http-request
name: 5 - Login Corriere -> token_no_access
url: "{{baseUrl}}/api/v1/auth/login"
method: POST
body:
  type: json
  content: |-
    {
      "email": "{{corriereEmail}}",
      "password": "{{corrierePassword}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      var b = pm.response.json();
      pm.test('Login Corriere -> 200', function () { pm.response.to.have.status(200); });
      if (b.data && b.data.token) { pm.collectionVariables.set('token_no_access', b.data.token); }
    language: text/javascript
order: 5000
