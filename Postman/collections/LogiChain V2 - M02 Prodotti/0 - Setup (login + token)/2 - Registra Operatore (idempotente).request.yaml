$kind: http-request
url: "{{baseUrl}}/api/v1/auth/register"
method: POST
headers:
  Authorization: Bearer {{token_admin}}
body:
  type: json
  content: |-
    {
      "nome": "Op",
      "cognome": "Eratore",
      "email": "{{operatorEmail}}",
      "password": "{{operatorPassword}}",
      "ruolo_id": 4
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Registra Operatore -> 201 o 409 (gia esistente)', function () {
        pm.expect([201, 409]).to.include(pm.response.code);
      });
    language: text/javascript
order: 2000
