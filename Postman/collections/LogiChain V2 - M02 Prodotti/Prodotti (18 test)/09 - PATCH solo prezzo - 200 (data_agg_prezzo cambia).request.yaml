$kind: http-request
name: 09 - PATCH solo prezzo -> 200 (data_agg_prezzo cambia)
url: "{{baseUrl}}/api/v1/prodotti/{{prodotto_id}}"
method: PATCH
headers:
  Authorization: Bearer {{token_admin}}
body:
  type: json
  content: |-
    {
      "prezzo": 2.5
    }
scripts:
  - type: afterResponse
    code: |-
      var b = pm.response.json();
      pm.test('09 PATCH solo prezzo -> 200', function () { pm.response.to.have.status(200); });
      pm.test('prezzo aggiornato a 2.50', function () { pm.expect(Number(b.data.prezzo)).to.eql(2.5); });
      pm.test('data_agg_prezzo CAMBIATA', function () {
        pm.expect(b.data.data_agg_prezzo).to.not.eql(pm.collectionVariables.get('data_agg_before'));
      });
      // memorizzo il nuovo valore per confronto con test 10
      pm.collectionVariables.set('data_agg_after_price', b.data.data_agg_prezzo);
    language: text/javascript
order: 9000
