$kind: http-request
name: 04 - POST prezzo = 0 -> 400
url: "{{baseUrl}}/api/v1/prodotti"
method: POST
headers:
  Authorization: Bearer {{token_admin}}
body:
  type: json
  content: |-
    {
      "nome": "Test Zero",
      "sku": "{{sku_1}}-Z0",
      "prezzo": 0
    }
scripts:
  - type: afterResponse
    code: |-
      var b = pm.response.json();
      pm.test('04 prezzo=0 -> 400', function () { pm.response.to.have.status(400); });
      pm.test('code = VALIDATION_ERROR', function () { pm.expect(b.code).to.eql('VALIDATION_ERROR'); });
    language: text/javascript
order: 4000
