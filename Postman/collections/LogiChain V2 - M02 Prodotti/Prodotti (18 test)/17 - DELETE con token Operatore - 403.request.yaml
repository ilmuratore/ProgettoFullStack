$kind: http-request
name: 17 - DELETE con token Operatore -> 403
url: "{{baseUrl}}/api/v1/prodotti/{{prodotto_id}}"
method: DELETE
headers:
  Authorization: Bearer {{token_read_only}}
scripts:
  - type: afterResponse
    code: |-
      var b = pm.response.json();
      pm.test('17 DELETE con Operatore -> 403', function () { pm.response.to.have.status(403); });
      pm.test('code = ACCESS_DENIED', function () { pm.expect(b.code).to.eql('ACCESS_DENIED'); });
    language: text/javascript
order: 18000
