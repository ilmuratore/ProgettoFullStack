$kind: http-request
name: 18 - GET lista con token Corriere -> 403
url: "{{baseUrl}}/api/v1/prodotti"
method: GET
headers:
  Authorization: Bearer {{token_no_access}}
scripts:
  - type: afterResponse
    code: |-
      var b = pm.response.json();
      pm.test('18 GET con Corriere -> 403', function () { pm.response.to.have.status(403); });
      pm.test('code = ACCESS_DENIED', function () { pm.expect(b.code).to.eql('ACCESS_DENIED'); });
    language: text/javascript
order: 19000
