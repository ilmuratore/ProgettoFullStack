$kind: http-request
name: 05 - POST prezzo negativo -> 400
url: "{{baseUrl}}/api/v1/prodotti"
method: POST
headers:
  Authorization: Bearer {{token_admin}}
body:
  type: json
  content: |-
    {
      "nome": "Test Neg",
      "sku": "{{sku_1}}-NEG",
      "prezzo": -5
    }
scripts:
  - type: afterResponse
    code: |-
      var b = pm.response.json();
      pm.test('05 prezzo negativo -> 400', function () { pm.response.to.have.status(400); });
      pm.test('code = VALIDATION_ERROR', function () { pm.expect(b.code).to.eql('VALIDATION_ERROR'); });
    language: text/javascript
order: 5000
