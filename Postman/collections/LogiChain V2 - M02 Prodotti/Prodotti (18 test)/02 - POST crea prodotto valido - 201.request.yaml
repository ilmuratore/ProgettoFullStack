$kind: http-request
name: 02 - POST crea prodotto valido -> 201
url: "{{baseUrl}}/api/v1/prodotti"
method: POST
headers:
  Authorization: Bearer {{token_admin}}
body:
  type: json
  content: |-
    {
      "nome": "Vite M6x20",
      "sku": "{{sku_1}}",
      "prezzo": 1.25
    }
scripts:
  - type: afterResponse
    code: |-
      var b = pm.response.json();
      pm.test('02 POST valido -> 201', function () { pm.response.to.have.status(201); });
      pm.test('ritorna id numerico', function () { pm.expect(b.data.id).to.be.a('number'); });
      pm.test('ritorna data_agg_prezzo', function () { pm.expect(b.data.data_agg_prezzo).to.be.ok; });
      pm.test('prezzo = 1.25', function () { pm.expect(Number(b.data.prezzo)).to.eql(1.25); });
      pm.collectionVariables.set('prodotto_id', b.data.id);
    language: text/javascript
order: 2000
