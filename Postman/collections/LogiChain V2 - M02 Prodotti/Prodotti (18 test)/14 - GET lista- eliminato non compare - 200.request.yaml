$kind: http-request
name: "14 - GET lista: eliminato non compare -> 200"
url: "{{baseUrl}}/api/v1/prodotti"
method: GET
headers:
  Authorization: Bearer {{token_admin}}
scripts:
  - type: afterResponse
    code: |-
      var b = pm.response.json();
      pm.test('14 lista -> 200', function () { pm.response.to.have.status(200); });
      pm.test('prodotto eliminato NON presente in lista', function () {
        var pid = Number(pm.collectionVariables.get('prodotto_id'));
        var ids = (b.data || []).map(function (p) { return p.id; });
        pm.expect(ids).to.not.include(pid);
      });
    language: text/javascript
order: 15000
