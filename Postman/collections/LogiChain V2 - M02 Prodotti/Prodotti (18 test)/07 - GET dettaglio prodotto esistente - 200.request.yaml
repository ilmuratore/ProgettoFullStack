$kind: http-request
name: 07 - GET dettaglio prodotto esistente -> 200
url: "{{baseUrl}}/api/v1/prodotti/{{prodotto_id}}"
method: GET
headers:
  Authorization: Bearer {{token_admin}}
scripts:
  - type: afterResponse
    code: |-
      var b = pm.response.json();
      pm.test('07 GET dettaglio -> 200', function () { pm.response.to.have.status(200); });
      pm.test('id corrisponde', function () { pm.expect(b.data.id).to.eql(Number(pm.collectionVariables.get('prodotto_id'))); });
      // memorizzo la data_agg_prezzo PRIMA della modifica prezzo (test 09)
      pm.collectionVariables.set('data_agg_before', b.data.data_agg_prezzo);
    language: text/javascript
order: 7000
