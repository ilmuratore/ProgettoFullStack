$kind: http-request
name: 11 - PATCH con SKU di un altro prodotto -> 409
url: "{{baseUrl}}/api/v1/prodotti/{{prodotto_id}}"
method: PATCH
headers:
  Authorization: Bearer {{token_admin}}
body:
  type: json
  content: |-
    {
      "sku": "{{sku_2}}"
    }
scripts:
  - type: afterResponse
    code: |-
      var b = pm.response.json();
      pm.test('11 PATCH con SKU di altro prodotto -> 409', function () { pm.response.to.have.status(409); });
      pm.test('code = DUPLICATE_ENTRY', function () { pm.expect(b.code).to.eql('DUPLICATE_ENTRY'); });
    language: text/javascript
order: 12000
