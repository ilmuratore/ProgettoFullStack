$kind: http-request
name: 13 - GET prodotto eliminato -> 404
url: "{{baseUrl}}/api/v1/prodotti/{{prodotto_id}}"
method: GET
headers:
  Authorization: Bearer {{token_admin}}
scripts:
  - type: afterResponse
    code: |-
      var b = pm.response.json();
      pm.test('13 GET prodotto eliminato -> 404', function () { pm.response.to.have.status(404); });
      pm.test('code = RESOURCE_NOT_FOUND', function () { pm.expect(b.code).to.eql('RESOURCE_NOT_FOUND'); });
    language: text/javascript
order: 14000
