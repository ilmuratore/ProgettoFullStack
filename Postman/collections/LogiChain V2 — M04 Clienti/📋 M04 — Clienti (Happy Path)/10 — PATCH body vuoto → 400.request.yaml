$kind: http-request
url: "{{base_url}}/api/v1/clienti/{{cliente_id}}"
method: PATCH
headers:
  Authorization: Bearer {{token_admin}}
  Content-Type: application/json
body:
  type: text
  content: "{}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('400 Bad Request — body senza campi validi', () => {
          pm.response.to.have.status(400);
      });

      pm.test('Codice VALIDATION_ERROR', () => {
          pm.expect(pm.response.json().code).to.eql('VALIDATION_ERROR');
      });
    language: text/javascript
order: 10000
