$kind: http-request
url: "{{base_url}}/api/v1/clienti/999999"
method: GET
headers:
  Authorization: Bearer {{token_admin}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('404 Not Found', () => pm.response.to.have.status(404));

      pm.test('Codice RESOURCE_NOT_FOUND', () => {
          const json = pm.response.json();
          pm.expect(json.code).to.eql('RESOURCE_NOT_FOUND');
      });
    language: text/javascript
order: 6000
