$kind: http-request
url: "{{base_url}}/api/v1/clienti/{{cliente_id}}"
method: PATCH
headers:
  Authorization: Bearer {{token_admin}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "ragione_sociale": "Beta Spa Rinominata",
      "source": "ecosystem"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));

      pm.test('ragione_sociale aggiornata', () => {
          pm.expect(pm.response.json().data.ragione_sociale).to.eql('Beta Spa Rinominata');
      });

      pm.test('source rimane manual (non modificabile via body)', () => {
          pm.expect(pm.response.json().data.source).to.eql('manual');
      });
    language: text/javascript
order: 9000
