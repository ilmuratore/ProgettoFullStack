$kind: http-request
url: "{{base_url}}/api/v1/clienti"
method: POST
headers:
  Authorization: Bearer {{token_admin}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "ragione_sociale": "Gamma Srl",
      "piva_cf": "11122233344",
      "source": "ecosystem"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('201 Created', () => pm.response.to.have.status(201));

      pm.test('source è manual anche se il body inviava ecosystem', () => {
          const json = pm.response.json();
          pm.expect(json.data.source).to.eql('manual');
      });

      // Pulizia: il cliente Gamma Srl va soft-deleted dopo i test
      const id = pm.response.json().data?.id;
      if (id) {
          pm.collectionVariables.set('cliente_gamma_id', id);
          console.log('ℹ️  cliente_gamma_id salvato per pulizia:', id);
      }
    language: text/javascript
order: 3000
