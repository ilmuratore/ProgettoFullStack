$kind: http-request
url: "{{base_url}}/api/v1/clienti/{{cliente_id}}"
method: PATCH
headers:
  Authorization: Bearer {{token_admin}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "telefono": "0612345678",
      "email": "nuovo@beta.it"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));

      pm.test('Campi aggiornati correttamente', () => {
          const d = pm.response.json().data;
          pm.expect(d.telefono).to.eql('0612345678');
          pm.expect(d.email).to.eql('nuovo@beta.it');
      });

      pm.test('source rimane manual dopo la modifica', () => {
          pm.expect(pm.response.json().data.source).to.eql('manual');
      });
    language: text/javascript
order: 7000
