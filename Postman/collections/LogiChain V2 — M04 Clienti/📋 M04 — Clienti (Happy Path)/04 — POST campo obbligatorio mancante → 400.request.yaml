$kind: http-request
url: "{{base_url}}/api/v1/clienti"
method: POST
headers:
  Authorization: Bearer {{token_admin}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "ragione_sociale": "Solo Nome Srl"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('400 Bad Request', () => pm.response.to.have.status(400));

      pm.test('Codice VALIDATION_ERROR', () => {
          const json = pm.response.json();
          pm.expect(json.status).to.eql('error');
          pm.expect(json.code).to.eql('VALIDATION_ERROR');
      });

      pm.test('Errore su piva_cf', () => {
          const json = pm.response.json();
          const fields = (json.details || []).map(d => d.field);
          pm.expect(fields).to.include('piva_cf');
      });
    language: text/javascript
order: 4000
