$kind: http-request
url: "{{base_url}}/api/v1/clienti"
method: GET
headers:
  Authorization: Bearer {{token_admin}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));

      pm.test('Struttura risposta corretta', () => {
          const json = pm.response.json();
          pm.expect(json.status).to.eql('success');
          pm.expect(json.data).to.be.an('array');
      });

      pm.test('Ogni cliente ha il campo source', () => {
          const json = pm.response.json();
          if (json.data.length > 0) {
              json.data.forEach(c => {
                  pm.expect(c).to.have.property('source');
                  pm.expect(['manual', 'ecosystem']).to.include(c.source);
              });
          }
      });

      pm.test('Nessun cliente con attivo=false nella lista', () => {
          const json = pm.response.json();
          json.data.forEach(c => {
              pm.expect(c.attivo).to.not.eql(false);
          });
      });
    language: text/javascript
order: 1000
