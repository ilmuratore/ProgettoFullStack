$kind: http-request
url: "{{base_url}}/api/v1/clienti"
method: GET
headers:
  Authorization: Bearer {{token_admin}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));

      pm.test('cliente_id eliminato non compare nella lista', () => {
          const eliminatoId = parseInt(pm.collectionVariables.get('cliente_id'));
          const lista = pm.response.json().data;
          const trovato = lista.find(c => c.id === eliminatoId);
          pm.expect(trovato).to.be.undefined;
      });

      pm.test('cliente_eco_id eliminato non compare nella lista', () => {
          const ecoId = parseInt(pm.collectionVariables.get('cliente_eco_id'));
          const lista = pm.response.json().data;
          const trovato = lista.find(c => c.id === ecoId);
          pm.expect(trovato).to.be.undefined;
      });
    language: text/javascript
order: 4000
