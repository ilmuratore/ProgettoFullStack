$kind: http-request
url: "{{base_url}}/api/v1/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "acquisti@logichain.it",
      "password": "Acquisti1234!"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK — login riuscito', () => {
          pm.response.to.have.status(200);
      });

      const json = pm.response.json();
      if (json.data?.token) {
          pm.collectionVariables.set('token_resp_acquisti', json.data.token);
          console.log('✅ token_resp_acquisti salvato');
      }
    language: text/javascript
order: 2000
