$kind: http-request
url: "{{base_url}}/api/v1/clienti"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('401 Unauthorized — token mancante', () => {
          pm.response.to.have.status(401);
      });

      pm.test('Codice AUTH_REQUIRED', () => {
          pm.expect(pm.response.json().code).to.eql('AUTH_REQUIRED');
      });
    language: text/javascript
order: 1000
