$kind: http-request
url: "{{base_url}}/api/v1/clienti"
method: POST
headers:
  Authorization: Bearer {{token_resp_acquisti}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "ragione_sociale": "Test Rbac Srl",
      "piva_cf": "00000000000"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('403 Forbidden — Resp. Acquisti non ha clienti:write', () => {
          pm.response.to.have.status(403);
      });

      pm.test('Codice ACCESS_DENIED', () => {
          pm.expect(pm.response.json().code).to.eql('ACCESS_DENIED');
      });
    language: text/javascript
order: 2000
