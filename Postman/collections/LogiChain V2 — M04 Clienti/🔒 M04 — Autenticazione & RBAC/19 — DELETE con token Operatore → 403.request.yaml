$kind: http-request
url: "{{base_url}}/api/v1/clienti/1"
method: DELETE
headers:
  Authorization: Bearer {{token_operatore}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('403 Forbidden — Operatore non ha clienti:delete', () => {
          pm.response.to.have.status(403);
      });

      pm.test('Codice ACCESS_DENIED', () => {
          pm.expect(pm.response.json().code).to.eql('ACCESS_DENIED');
      });
    language: text/javascript
order: 5000
