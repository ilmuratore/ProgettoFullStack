      x-required-permission: fornitori:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FornitoreCreateRequest' }
            example:
              ragione_sociale: "Metalli & Co. S.p.A."
              piva: "07654321098"
              indirizzo: "Via Roma 5, 25100 Brescia BS"
              email: info@metallieco.it
              telefono: "030 1234567"
              sito_web: "https://www.metallieco.it"
              descrizione_aziendale: "Fornitura di acciai speciali e leghe per l'industria."
      responses:
        "201":
          description: Fornitore creato
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data:   { $ref: '#/components/schemas/Fornitore' }
              example:
                status: success
                data:
                  id: 4
                  ragione_sociale: "Metalli & Co. S.p.A."
                  piva: "07654321098"
                  indirizzo: "Via Roma 5, 25100 Brescia BS"
