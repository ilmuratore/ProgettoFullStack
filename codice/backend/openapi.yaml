    get:
      tags: [Ecosystem]
      summary: Scheda prodotto ecosistema
      description: |
        Restituisce la scheda completa del prodotto: anagrafica, disponibilità per magazzino, giacenza totale
        e fornitore principale (ultimo fornitore da cui è stato ordinato). Richiede permesso `ecosystem:read`.
