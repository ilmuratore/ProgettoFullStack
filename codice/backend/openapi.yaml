      tags:
        - Fornitori
      summary: Dettaglio fornitore
      description: 'Permesso richiesto: `fornitori:read`.'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Fornitori
      summary: Aggiorna fornitore (ecosystem → 403)
      description: 'Permesso richiesto: `fornitori:write`.'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ragione_sociale:
                  type: string
                piva:
                  type: string
                indirizzo:
                  type: string
                email:
                  type: string
                telefono:
                  type: string
                sito_web:
                  type: string
                descrizione_aziendale:
                  type: string
                attivo:
                  type: boolean
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags:
        - Fornitori
      summary: Soft delete fornitore
      description: 'Permesso richiesto: `fornitori:delete`.'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Nessun contenuto
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /fornitori/{id}/contatti:
    get:
      tags:
        - Fornitori
      summary: Lista contatti fornitore
      description: 'Permesso richiesto: `fornitori:read`.'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
        - Fornitori
      summary: Crea contatto fornitore
      description: 'Permesso richiesto: `fornitori:write`.'
      parameters:
        - name: id
          in: path
          required: true
