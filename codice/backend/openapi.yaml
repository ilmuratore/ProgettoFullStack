                      magazzino_id: 1
                      corsia: 1
                      scaffale: 1
                      codice: 1-01-01
                      codice_composto: "1-01-01"
                      attivo: true
                      temperatura_controllata: false
                      totale_giacenza: 250
                      created_at: "2026-01-10T08:00:00.000Z"
                      updated_at: "2026-01-10T08:00:00.000Z"
                    - id: 2
