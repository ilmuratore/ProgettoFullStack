openapi: 3.0.3

info:
  title: LogiChain ERP — API
  version: "2.0.0"
  description: |
    API REST per LogiChain ERP — milestone M01–M07.

    ## Autenticazione
    Tutte le rotte (eccetto `POST /auth/login`) richiedono un token JWT nell'header:
    ```
    Authorization: Bearer <token>
    ```
    Il token si ottiene dal login. Ha scadenza configurata lato server.

    ## Formato risposte
    Ogni risposta segue sempre uno di questi due formati:

    **Successo**
    ```json
    { "status": "success", "data": { ... } }
    ```

    **Errore**
    ```json
    { "status": "error", "code": "CODICE_ERRORE", "message": "Descrizione", "details": [] }
    ```

    ## Codici errore applicativi
    | Codice | HTTP | Descrizione |
    |---|---|---|
    | `VALIDATION_ERROR` | 400 | Campi mancanti o non validi |
    | `AUTH_REQUIRED` | 401 | Token mancante o scaduto |
    | `CREDENZIALI_NON_VALIDE` | 401 | Email o password errata al login |
    | `PASSWORD_NON_VALIDA` | 401 | La password attuale non è corretta (cambio password) |
    | `ACCESS_DENIED` | 403 | Permesso insufficiente |
    | `RESOURCE_NOT_FOUND` | 404 | Risorsa non trovata |
    | `DUPLICATE_ENTRY` | 409 | Violazione unicità (SKU, P.IVA, codice...) |
    | `CATEGORIA_CON_PRODOTTI` | 409 | Impossibile eliminare la categoria: ha prodotti associati |
    | `CATEGORIA_CON_SOTTOCATEGORIE` | 409 | Impossibile eliminare la categoria: ha sottocategorie |
    | `INSUFFICIENT_STOCK` | 422 | Giacenza insufficiente per il movimento richiesto |
    | `INTERNAL_SERVER_ERROR` | 500 | Errore generico server |

    ## RBAC — Tutti i permessi (30)
    Tutti i permessi sono presenti nel DB (seed). Le colonne `Rotte attive` indicano se esiste
    già almeno un endpoint montato in `server.js` che richiede quel permesso.

    | Permesso | Modulo | Rotte attive |
    |---|---|---|
    | `utenti:read` | Visualizza utenti | ⬜ (utentiRoutes non montata) |
    | `utenti:write` | Registrazione nuovi utenti | ✅ M01 |
    | `utenti:delete` | Elimina utenti | ⬜ (utentiRoutes non montata) |
    | `prodotti:read` | Visualizza prodotti e categorie | ✅ M02 |
    | `prodotti:write` | Crea/modifica prodotti e categorie | ✅ M02 |
    | `prodotti:delete` | Elimina prodotti e categorie | ✅ M02 |
    | `fornitori:read` | Visualizza fornitori e contatti | ✅ M03 |
    | `fornitori:write` | Crea/modifica fornitori | ✅ M03 |
    | `fornitori:delete` | Elimina fornitori | ✅ M03 |
    | `clienti:read` | Visualizza clienti e destinazioni | ✅ M04 |
    | `clienti:write` | Crea/modifica clienti | ✅ M04 |
    | `clienti:delete` | Elimina clienti | ✅ M04 |
    | `dipendenti:read` | Visualizza dipendenti | ✅ M05 |
    | `dipendenti:write` | Crea/modifica dipendenti | ✅ M05 |
    | `dipendenti:delete` | Elimina dipendenti | ✅ M05 |
    | `magazzino:read` | Visualizza magazzini, ubicazioni e corrieri | ✅ M05–M06 |
    | `magazzino:write` | Crea/modifica magazzini, ubicazioni e corrieri | ✅ M05–M06 |
    | `giacenze:read` | Visualizza giacenze e movimenti stock | ✅ M07 |
    | `giacenze:write` | Registra movimenti stock | ✅ M07 |
    | `acquisti:read` | Visualizza ordini di acquisto e ricezioni | ⬜ M08 |
    | `acquisti:write` | Crea/modifica ordini di acquisto | ⬜ M08 |
    | `acquisti:approve` | Approva ordini di acquisto | ⬜ M08 |
    | `ordini:read` | Visualizza ordini di vendita | ⬜ M09 |
    | `ordini:write` | Crea/modifica ordini e gestisce picking | ⬜ M09 |
    | `ordini:approve` | Approva ordini commerciali | ⬜ M09 |
    | `spedizioni:read` | Visualizza spedizioni e DDT | ⬜ M10 |
    | `spedizioni:write` | Gestisce spedizioni e DDT | ⬜ M10 |
    | `notifiche:read` | Visualizza notifiche | ⬜ M11 |
    | `dashboard:read` | Visualizza dashboard e KPI | ⬜ M12 |
    | `ecosystem:read` | Ricerca nell'ecosistema globale | ⬜ M13–M16 |

    ## RBAC — Matrice ruoli → permessi
    Fonte: `seed_ruoli_permessi.js`. Legenda: ✅ ha il permesso · — non ce l'ha.

    | Permesso | Admin | Resp.Az | Supporto | Resp.HR | Resp.Vend | Resp.Acq | Resp.Mag | Operatore | Corriere |
    |---|---|---|---|---|---|---|---|---|---|
    | `utenti:read` | ✅ | ✅ | ✅ | ✅ | — | — | — | — | — |
    | `utenti:write` | ✅ | — | — | — | — | — | — | — | — |
    | `utenti:delete` | ✅ | — | — | — | — | — | — | — | — |
    | `prodotti:read` | ✅ | ✅ | ✅ | — | ✅ | ✅ | ✅ | ✅ | — |
    | `prodotti:write` | ✅ | ✅ | — | — | — | ✅ | ✅ | — | — |
    | `prodotti:delete` | ✅ | ✅ | — | — | — | — | — | — | — |
    | `fornitori:read` | ✅ | ✅ | ✅ | — | — | ✅ | ✅ | ✅ | — |
    | `fornitori:write` | ✅ | ✅ | — | — | — | ✅ | — | — | — |
    | `fornitori:delete` | ✅ | ✅ | — | — | — | — | — | — | — |
    | `clienti:read` | ✅ | ✅ | ✅ | — | ✅ | ✅ | ✅ | ✅ | — |
    | `clienti:write` | ✅ | ✅ | — | — | ✅ | ✅ | — | — | — |
    | `clienti:delete` | ✅ | ✅ | — | — | ✅ | — | — | — | — |
    | `dipendenti:read` | ✅ | ✅ | — | ✅ | — | — | — | — | — |
    | `dipendenti:write` | ✅ | ✅ | — | ✅ | — | — | — | — | — |
    | `dipendenti:delete` | ✅ | ✅ | — | ✅ | — | — | — | — | — |
    | `magazzino:read` | ✅ | ✅ | ✅ | — | — | ✅ | ✅ | ✅ | — |
    | `magazzino:write` | ✅ | ✅ | — | — | — | — | ✅ | — | — |
    | `giacenze:read` | ✅ | ✅ | ✅ | — | ✅ | ✅ | ✅ | ✅ | — |
    | `giacenze:write` | ✅ | ✅ | — | — | ✅ | — | ✅ | ✅ | — |
    | `acquisti:read` | ✅ | ✅ | ✅ | — | — | ✅ | ✅ | — | — |
    | `acquisti:write` | ✅ | ✅ | — | — | — | ✅ | — | — | — |
    | `acquisti:approve` | ✅ | ✅ | — | — | — | ✅ | ✅ | — | — |
    | `ordini:read` | ✅ | ✅ | ✅ | — | ✅ | — | ✅ | ✅ | — |
    | `ordini:write` | ✅ | ✅ | — | — | ✅ | — | — | ✅ | — |
    | `ordini:approve` | ✅ | ✅ | — | — | ✅ | — | ✅ | ✅ | — |
    | `spedizioni:read` | ✅ | ✅ | ✅ | — | — | — | ✅ | ✅ | ✅ |
    | `spedizioni:write` | ✅ | ✅ | — | — | — | — | ✅ | — | ✅ |
    | `notifiche:read` | ✅ | ✅ | ✅ | ✅ | ✅ | ✅ | ✅ | ✅ | ✅ |
    | `dashboard:read` | ✅ | ✅ | ✅ | ✅ | ✅ | ✅ | ✅ | ✅ | ✅ |
    | `ecosystem:read` | ✅ | ✅ | ✅ | — | — | ✅ | — | — | — |

    > **Nota**: Dev ha gli stessi permessi di Admin (ALL). Resp. Azienda ha tutti tranne `utenti:write/delete`.

    ## RBAC — Ruoli disponibili (ruolo_id)
    Fonte: `seed_ruoli_permessi.js`. Il campo `ruolo_id` è richiesto da `POST /auth/register`
    e restituito da `GET /auth/me` come `ruolo_id` + `ruolo_nome`.

    | `ruolo_id` | `ruolo_nome` | Descrizione |
    |---|---|---|
    | `1` | Admin | Accesso completo al sistema |
    | `2` | Dev | Accesso tecnico completo per sviluppo e manutenzione |
    | `3` | Supporto | Accesso in sola lettura per assistenza clienti |
    | `4` | Resp. Azienda | Responsabile aziendale con visibilità trasversale |
    | `5` | Resp. HR | Gestione risorse umane e dipendenti |
    | `6` | Resp. Vendite | Gestione ordini in uscita, clienti e giacenze commerciali |
    | `7` | Resp. Acquisti | Gestione acquisti, fornitori e approvvigionamenti |
    | `8` | Resp. Magazzino | Gestione magazzino, giacenze, spedizioni e corrieri |
    | `9` | Operatore | Operatività su ordini, giacenze e spedizioni |
    | `10` | Corriere | Visualizzazione e aggiornamento spedizioni assegnate |

    > **Nota frontend**: `ruolo_id: 1` (Admin) è riservato — non assegnabile via UI.
    > `ruolo_id: 2` (Dev) e `ruolo_id: 3` (Supporto) sono tecnici/interni.
    > I ruoli operativi standard da esporre nel dropdown di registrazione sono `4`–`10`.

servers:
  - url: http://localhost:3000/api/v1
    description: Sviluppo locale
  - url: http://localhost:4010/api/v1
    description: Mock server Prism (per frontend senza backend)

tags:
  - name: Auth
    description: Autenticazione e profilo utente
  - name: Utenti
    description: Gestione utenti — password reset admin (utenti:write). Modulo parziale — altre operazioni CRUD in roadmap.
  - name: Prodotti
    description: Anagrafica prodotti e listino prezzi (M02)
  - name: Categorie
    description: Categorie prodotti — dominio Prodotti, permessi prodotti:* (M02 ext)
  - name: Fornitori
    description: Anagrafica fornitori (M03)
  - name: Clienti
    description: Anagrafica clienti (M04)
  - name: Destinazioni
    description: Indirizzi di consegna dei clienti — sub-risorsa, permessi clienti:* (M09)
  - name: Corrieri
    description: Anagrafica aziende corriere — permessi magazzino:read/write (M05)
  - name: Dipendenti
    description: Anagrafica personale operativo interno (M05)
  - name: Magazzini
    description: Gestione magazzini e ubicazioni (M06)
  - name: Ubicazioni
    description: Slot fisici all'interno dei magazzini (M06)
  - name: Giacenze
    description: Livelli di stock per prodotto/ubicazione (M07)
  - name: MovimentiStock
    description: Registro append-only di tutti i movimenti di magazzino (M07)
  - name: OrdiniAcquisto
    description: Ordini in entrata / Purchase Orders — ciclo BOZZA→COMPLETATO, permessi acquisti:* (M08)
  - name: Ricezioni
    description: Ricezioni merce su ordini di acquisto e relative righe — permessi acquisti:* (M08)
  - name: Ordini
    description: |
      Ordini di vendita / in uscita (M09). Ciclo commerciale BOZZA → CONFERMATO → SPEDITO/ANNULLATO
      e ciclo picking NON_AVVIATO → IN_PICKING → PICKING_COMPLETATO.
      La disponibilità per le vendite è calcolata come giacenza fisica totale meno la quantità
      impegnata da ordini CONFERMATO non ancora prelevati. Lo scarico effettivo delle giacenze
      Permessi: ordini:read · ordini:write (Resp. Vendite) · ordini:approve (stato + picking).

# ─────────────────────────────────────────────
# COMPONENTI RIUTILIZZABILI
# ─────────────────────────────────────────────
components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: Token mancante o non valido
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            status: error
            code: AUTH_REQUIRED
            message: Token non fornito o scaduto
            details: []

    Forbidden:
      description: Permesso insufficiente
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            status: error
            code: ACCESS_DENIED
            message: Permesso insufficiente per questa operazione
            details: []

    NotFound:
      description: Risorsa non trovata
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            status: error
            code: RESOURCE_NOT_FOUND
            message: Risorsa non trovata
            details: []

    ValidationError:
      description: Dati non validi
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            status: error
            code: VALIDATION_ERROR
            message: Dati non validi
            details:
              - field: nome
                message: Campo obbligatorio

    DuplicateEntry:
      description: Violazione unicità
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            status: error
            code: DUPLICATE_ENTRY
            message: Valore già esistente
            details: []

    NoContent:
      description: Eliminazione completata (nessun body)

    InsufficientStock:
      description: Giacenza insufficiente per completare il movimento
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            status: error
            code: INSUFFICIENT_STOCK
            message: Giacenza insufficiente per completare il movimento
            details: []

  schemas:

    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          enum: [error]
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

    # ── AUTH — PASSWORD ───────────────────────────────

    ChangePasswordRequest:
      type: object
      required: [password_attuale, password_nuova]
      description: |
        Cambio password dell'utente autenticato.
        `password_nuova` deve essere diversa da `password_attuale`.
      properties:
        password_attuale: { type: string, minLength: 6, example: vecchiaPassword1! }
        password_nuova:   { type: string, minLength: 6, example: NuovaPassword2! }

    AdminResetPasswordRequest:
      type: object
      required: [password_nuova]
      description: Reset forzato password da parte di un utente con `utenti:write`. Non richiede la password attuale.
      properties:
        password_nuova: { type: string, minLength: 6, example: ResetPassword3! }

    # ── AUTH ──────────────────────────────────

    Utente:
      type: object
      properties:
        id:          { type: integer, example: 1 }
        nome:        { type: string,  example: Marco }
        cognome:     { type: string,  example: Bianchi }
        email:       { type: string,  format: email, example: marco.bianchi@logichain.it }
        ruolo_id:    { type: integer, example: 7, description: "Vedi tabella 'Ruoli disponibili' — valori 1–10" }
        ruolo_nome:  { type: string,  example: "Resp. Acquisti", description: "Nome del ruolo corrispondente a ruolo_id" }
        created_at:  { type: string,  format: date-time }
        updated_at:  { type: string,  format: date-time }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:    { type: string, format: email, example: admin@logichain.it }
        password: { type: string, minLength: 6,  example: password123 }

    LoginResponse:
      type: object
      properties:
        token:  { type: string, example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9... }
        utente: { $ref: '#/components/schemas/Utente' }

    RegisterRequest:
      type: object
      required: [nome, cognome, email, password, ruolo_id]
      description: |
        `ruolo_id` deve corrispondere a un ruolo esistente nel DB.
        Vedi tabella "Ruoli disponibili" nell'info per i valori validi (1–10).
        Per la UI di registrazione standard usare i ruoli operativi: 4–10.
      properties:
        nome:     { type: string,  example: Laura }
        cognome:  { type: string,  example: Ferretti }
        email:    { type: string,  format: email, example: laura.ferretti@logichain.it }
        password: { type: string,  minLength: 6, example: sicura456 }
        ruolo_id: { type: integer, minimum: 1, maximum: 10, example: 7, description: "ID ruolo — vedi tabella Ruoli disponibili" }

    # ── PRODOTTI ──────────────────────────────

    Prodotto:
      type: object
      properties:
        id:              { type: integer, example: 7 }
        sku:             { type: string,  example: VLV-001 }
        nome:            { type: string,  example: Valvola a sfera 1/2" }
        descrizione:     { type: string,  example: Valvola in ottone per impianti idraulici, nullable: true }
        categoria_id:    { type: integer, example: 3, nullable: true }
        categoria:       { type: string,  example: Valvolame, nullable: true, description: "Nome categoria — presente solo nelle GET con JOIN (findById). Assente in POST/PATCH response." }
        unita_misura:    { type: string,  example: pz, nullable: true }
        peso_kg:         { type: number,  format: float, example: 0.35, nullable: true }
        scorta_minima:   { type: integer, example: 50 }
        prezzo:          { type: number,  format: float, example: 12.50 }
        data_agg_prezzo: { type: string,  format: date-time, example: "2026-05-15T10:30:00.000Z" }
        attivo:          { type: boolean, example: true }
        created_at:      { type: string,  format: date-time }
        updated_at:      { type: string,  format: date-time }

    ProdottoListino:
      description: Vista ridotta usata nella lista prodotti (M02 — findListino)
      type: object
      properties:
        id:              { type: integer, example: 7 }
        sku:             { type: string,  example: VLV-001 }
        nome:            { type: string,  example: "Valvola a sfera 1/2\"" }
        prezzo:          { type: number,  format: float, example: 12.50 }
        data_agg_prezzo: { type: string,  format: date-time, example: "2026-05-15T10:30:00.000Z" }
        attivo:          { type: boolean, example: true }
        created_at:      { type: string,  format: date-time }

    ProdottoCreateRequest:
      type: object
      required: [nome, sku, prezzo]
      properties:
        nome:          { type: string,  example: "Tubo in acciaio inox DN50" }
        sku:           { type: string,  example: TUB-INOX-050 }
        prezzo:        { type: number,  minimum: 0.01, example: 48.00 }
        descrizione:   { type: string,  example: "Tubo in acciaio inox AISI 316L, spessore 2mm" }
        categoria_id:  { type: integer, minimum: 1, example: 3, description: "ID categoria esistente" }
        unita_misura:  { type: string,  example: mt }
        peso_kg:       { type: number,  minimum: 0, example: 1.20 }
        scorta_minima: { type: integer, minimum: 0, example: 10, description: "Default 0 se omesso" }
        attivo:        { type: boolean, example: true, description: "Default true se omesso" }

    ProdottoUpdateRequest:
      type: object
      description: Tutti i campi sono opzionali. Inviare solo quelli da modificare.
      properties:
        nome:          { type: string,  example: "Tubo in acciaio inox DN50 — rev." }
        sku:           { type: string,  example: TUB-INOX-050-R }
        prezzo:        { type: number,  minimum: 0.01, example: 52.00 }
        descrizione:   { type: string,  example: "Revisione specifiche tecniche" }
        categoria_id:  { type: integer, minimum: 1, example: 4 }
        unita_misura:  { type: string,  example: pz }
        peso_kg:       { type: number,  minimum: 0, example: 0.80 }
        scorta_minima: { type: integer, minimum: 0, example: 20 }
        attivo:        { type: boolean, example: true }

    # ── CATEGORIE ─────────────────────────────

    Categoria:
      type: object
      properties:
        id:                    { type: integer, example: 3 }
        nome:                  { type: string,  example: Valvolame }
        categoria_padre_id:    { type: integer, example: 1, nullable: true }
        categoria_padre_nome:  { type: string,  example: Componentistica, nullable: true }
        prodotti_count:        { type: integer, example: 12, description: "Numero di prodotti attivi associati a questa categoria" }
        created_at:            { type: string,  format: date-time }
        updated_at:            { type: string,  format: date-time }

    CategoriaCreateRequest:
      type: object
      required: [nome]
      properties:
        nome:               { type: string,  example: Raccorderia, description: "Deve essere univoco (case-insensitive)" }
        categoria_padre_id: { type: integer, example: 1, description: "Omettere o null per categoria radice. Max 2 livelli." }

    CategoriaUpdateRequest:
      type: object
      description: |
        Tutti i campi sono opzionali. Inviare solo quelli da modificare.
        Per rimuovere il padre (promuovere a categoria radice) inviare `categoria_padre_id: null`.
      properties:
        nome:               { type: string,  example: "Raccorderia — aggiornato" }
        categoria_padre_id: { type: integer, nullable: true, example: null, description: "null = rimozione padre" }

    # ── FORNITORI ─────────────────────────────

    Fornitore:
      type: object
      properties:
        id:                    { type: integer, example: 3 }
        ragione_sociale:       { type: string,  example: "Tecnofluid S.r.l." }
        piva:                  { type: string,  example: "02345678901", nullable: true }
        indirizzo:             { type: string,  example: "Via dell'Industria 22, 20090 Segrate MI", nullable: true }
        email:                 { type: string,  format: email, example: acquisti@tecnofluid.it, nullable: true }
        telefono:              { type: string,  example: "02 9876543", nullable: true }
        lead_time_giorni:      { type: integer, example: 7, nullable: true }
        source:                { type: string,  enum: [manual, ecosystem], example: manual }
        sito_web:              { type: string,  example: "https://www.tecnofluid.it", nullable: true }
        descrizione_aziendale: { type: string,  example: "Distributore di componentistica idraulica e pneumatica per l'industria manifatturiera.", nullable: true }
        attivo:                { type: boolean, example: true }
        created_at:            { type: string,  format: date-time }
        updated_at:            { type: string,  format: date-time }

    FornitoreCreateRequest:
      type: object
      required: [ragione_sociale, piva]
      description: |
        `source` non va mai inviato — viene forzato a `manual` dal server.
      properties:
        ragione_sociale:       { type: string, example: "Metalli & Co. S.p.A." }
        piva:                  { type: string, example: "07654321098" }
        indirizzo:             { type: string, example: "Via Roma 5, 25100 Brescia BS" }
        email:                 { type: string, format: email, example: info@metallieco.it }
        telefono:              { type: string, example: "030 1234567" }
        sito_web:              { type: string, example: "https://www.metallieco.it" }
        descrizione_aziendale: { type: string, example: "Fornitura di acciai speciali e leghe per l'industria." }

    FornitoreUpdateRequest:
      type: object
      description: |
        Tutti i campi sono opzionali. Inviare solo quelli da modificare.
        **Attenzione**: i fornitori con `source=ecosystem` restituiscono 403 su questo endpoint.
      properties:
        ragione_sociale:       { type: string, example: "Metalli & Co. S.p.A. — aggiornato" }
        piva:                  { type: string, example: "07654321098" }
        indirizzo:             { type: string, example: "Via Nuova 10, 25100 Brescia BS" }
        email:                 { type: string, format: email, example: nuovo@metallieco.it }
        telefono:              { type: string, example: "030 9876543" }
        sito_web:              { type: string, example: "https://www.metallieco.it" }
        descrizione_aziendale: { type: string, example: "Descrizione aggiornata." }

    # ── CLIENTI ───────────────────────────────

    Cliente:
      type: object
      properties:
        id:              { type: integer, example: 5 }
        ragione_sociale: { type: string,  example: "Officine Manzoni S.r.l." }
        piva_cf:         { type: string,  example: "03456789012", nullable: true }
        email:           { type: string,  format: email, example: ordini@manzoni.it, nullable: true }
        telefono:        { type: string,  example: "035 456789", nullable: true }
        source:          { type: string,  enum: [manual, ecosystem], example: manual }
        attivo:          { type: boolean, example: true }
        created_at:      { type: string,  format: date-time }
        updated_at:      { type: string,  format: date-time }

    ClienteCreateRequest:
      type: object
      required: [ragione_sociale, piva_cf]
      properties:
        ragione_sociale: { type: string, example: "Costruzioni Riviera S.r.l." }
        piva_cf:         { type: string, example: "08765432109" }
        email:           { type: string, format: email, example: info@costruzioniriviera.it }
        telefono:        { type: string, example: "0185 12345" }

    ClienteUpdateRequest:
      type: object
      description: Tutti i campi sono opzionali.
      properties:
        ragione_sociale: { type: string, example: "Costruzioni Riviera S.r.l. — aggiornato" }
        piva_cf:         { type: string, example: "08765432109" }
        email:           { type: string, format: email, example: nuovo@costruzioniriviera.it }
        telefono:        { type: string, example: "0185 99999" }

    # ── CORRIERI ──────────────────────────────

    Corriere:
      type: object
      properties:
        id:       { type: integer, example: 2 }
        codice:   { type: string,  example: BRT }
        nome:     { type: string,  example: "BRT Bartolini" }
        telefono: { type: string,  example: "02 1234567", nullable: true }
        email:    { type: string,  format: email, example: operativo.nord@brt.it, nullable: true }
        attivo:   { type: boolean, example: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CorriereCreateRequest:
      type: object
      required: [codice, nome]
      properties:
        codice:   { type: string, example: GLS }
        nome:     { type: string, example: "GLS Italy S.r.l." }
        telefono: { type: string, example: "800 123456" }
        email:    { type: string, format: email, example: clienti@gls-italy.com }

    CorriereUpdateRequest:
      type: object
      description: Tutti i campi sono opzionali.
      properties:
        codice:   { type: string, example: GLS-IT }
        nome:     { type: string, example: "GLS Italy S.r.l. — aggiornato" }
        telefono: { type: string, example: "800 999888" }
        email:    { type: string, format: email, example: nuovo@gls-italy.com }

    # ── DIPENDENTI ────────────────────────────

    Dipendente:
      type: object
      properties:
        id:              { type: integer, example: 4 }
        nome:            { type: string,  example: Giuseppe }
        cognome:         { type: string,  example: Esposito }
        codice_fiscale:  { type: string,  example: SPSGPP85M12F839W }
        ruolo_operativo: { type: string,  example: "Magazziniere", nullable: true }
        data_assunzione: { type: string,  format: date, example: "2021-03-01", nullable: true }
        utente_id:       { type: integer, example: 6, nullable: true }
        created_at:      { type: string,  format: date-time }
        updated_at:      { type: string,  format: date-time }

    DipendenteCreateRequest:
      type: object
      required: [nome, cognome, codice_fiscale]
      properties:
        nome:            { type: string,  example: Federica }
        cognome:         { type: string,  example: Russo }
        codice_fiscale:  { type: string,  example: RSSFRC92A41L219K }
        ruolo_operativo: { type: string,  example: "Addetto spedizioni" }
        data_assunzione: { type: string,  format: date, example: "2024-01-15" }
        utente_id:       { type: integer, example: 8, nullable: true }

    DipendenteUpdateRequest:
      type: object
      description: Tutti i campi sono opzionali.
      properties:
        nome:            { type: string,  example: Federica }
        cognome:         { type: string,  example: Russo }
        codice_fiscale:  { type: string,  example: RSSFRC92A41L219K }
        ruolo_operativo: { type: string,  example: "Responsabile spedizioni" }
        data_assunzione: { type: string,  format: date, example: "2024-01-15" }
        utente_id:       { type: integer, example: 8, nullable: true }

    # ── MAGAZZINI ─────────────────────────────

    Ubicazione:
      type: object
      properties:
        id:                      { type: integer, example: 12 }
        magazzino_id:            { type: integer, example: 1 }
        corsia:                  { type: integer, example: 2 }
        scaffale:                { type: integer, example: 5 }
        codice:                  { type: string,  example: "1-02-05" }
        codice_composto:         { type: string,  example: "1-02-05", description: "Campo calcolato aggiunto dal service — valore identico a codice (non presente come colonna separata nel DB)" }
        attivo:                  { type: boolean, example: true }
        temperatura_controllata: { type: boolean, example: false }
        totale_giacenza:         { type: integer, example: 120, description: "Presente solo nel dettaglio magazzino (GET /:id)" }
        created_at:              { type: string,  format: date-time }
        updated_at:              { type: string,  format: date-time }

    Magazzino:
      type: object
      properties:
        id:        { type: integer, example: 1 }
        codice:    { type: string,  example: MAG-A }
        nome:      { type: string,  example: "Magazzino principale Sesto" }
        indirizzo: { type: string,  example: "Via dell'Artigianato 14", nullable: true }
        cap:       { type: string,  example: "20099", nullable: true }
        citta:     { type: string,  example: "Sesto San Giovanni", nullable: true }
        provincia: { type: string,  example: MI, nullable: true }
        paese:     { type: string,  example: Italia, nullable: true }
        attivo:    { type: boolean, example: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    MagazzinoConUbicazioni:
      allOf:
        - $ref: '#/components/schemas/Magazzino'
        - type: object
          properties:
            ubicazioni:
              type: array
              items: { $ref: '#/components/schemas/Ubicazione' }

    MagazzinoCreateRequest:
      type: object
      required: [codice, nome]
      description: "`codice` non è modificabile dopo la creazione."
      properties:
        codice:    { type: string, example: MAG-B }
        nome:      { type: string, example: "Magazzino secondario Monza" }
        indirizzo: { type: string, example: "Via Borgazzi 45" }
        cap:       { type: string, example: "20900" }
        citta:     { type: string, example: Monza }
        provincia: { type: string, example: MB }
        paese:     { type: string, example: Italia }

    MagazzinoUpdateRequest:
      type: object
      description: Tutti i campi sono opzionali. `codice` non è modificabile.
      properties:
        nome:      { type: string, example: "Magazzino secondario Monza — aggiornato" }
        indirizzo: { type: string, example: "Via Borgazzi 100" }
        cap:       { type: string, example: "20900" }
        citta:     { type: string, example: Monza }
        provincia: { type: string, example: MB }
        paese:     { type: string, example: Italia }

    UbicazioneCreateRequest:
      type: object
      required: [corsia, scaffale]
      properties:
        corsia:                  { type: integer, minimum: 1, example: 3 }
        scaffale:                { type: integer, minimum: 1, example: 7 }
        temperatura_controllata: { type: boolean, example: false }

    UbicazioneUpdateTemperaturaRequest:
      type: object
      required: [temperatura_controllata]
      properties:
        temperatura_controllata: { type: boolean, example: true }

    # ── GIACENZE & MOVIMENTI STOCK (M07) ──────

    Giacenza:
      description: |
        Livello di stock di un prodotto in un'ubicazione specifica.
        Generato da `giacenzeModel.findByProdottoId` con JOIN su prodotti, ubicazioni, magazzini.
      type: object
      properties:
        id:           { type: integer, example: 23 }
        prodotto_id:  { type: integer, example: 7 }
        sku:          { type: string,  example: VLV-001 }
        prodotto:     { type: string,  example: "Valvola a sfera 1/2\"", description: "nome del prodotto" }
        ubicazione_id: { type: integer, example: 12 }
        ubicazione:   { type: string,  example: "1-02-05", description: "codice ubicazione storato nel DB" }
        magazzino:    { type: string,  example: "Magazzino principale Sesto", description: "nome magazzino" }
        quantita:     { type: integer, example: 85 }

    MovimentoStock:
      description: |
        Record singolo nel registro append-only dei movimenti di magazzino.
        `quantita` è sempre positiva — la direzione è determinata da `tipo`.
        Per SPOSTAMENTO vengono creati **due** record separati (SCARICO sulla sorgente + CARICO sulla destinazione).
      type: object
      properties:
        id:           { type: integer, example: 41 }
        prodotto_id:  { type: integer, example: 7 }
        sku:          { type: string,  example: VLV-001 }
        prodotto:     { type: string,  example: "Valvola a sfera 1/2\"" }
        ubicazione_id: { type: integer, example: 12 }
        ubicazione:   { type: string,  example: "1-02-05" }
        quantita:     { type: integer, example: 10, description: "Sempre positiva. La direzione del flusso è determinata da `tipo`." }
        tipo:
          type: string
          enum: [CARICO_ACQUISTO, SCARICO_VENDITA, SPOSTAMENTO, RETTIFICA_POSITIVA, RETTIFICA_NEGATIVA, RESO]
          example: CARICO_ACQUISTO
        riferimento:  { type: string,  example: "ordine_acquisto:42", nullable: true, description: "Documento sorgente in formato {tipo}:{id}" }
        note:         { type: string,  example: "Ricevuto con DDT 2026-0031", nullable: true, description: "Obbligatorio per RETTIFICA_POSITIVA e RETTIFICA_NEGATIVA" }
        created_at:   { type: string,  format: date-time, example: "2026-06-08T10:15:00.000Z" }

    MovimentoStockCreateRequest:
      type: object
      required: [prodotto_id, quantita, movimento_tipo]
      description: |
        ## Campi per tipo di movimento

        | `movimento_tipo` | Campi ubicazione richiesti | `note` |
        |---|---|---|
        | `CARICO_ACQUISTO` | `ubicazione_id` | opzionale |
        | `SCARICO_VENDITA` | `ubicazione_id` | opzionale |
        | `RETTIFICA_POSITIVA` | `ubicazione_id` | **obbligatoria** |
        | `RETTIFICA_NEGATIVA` | `ubicazione_id` | **obbligatoria** |
        | `RESO` | `ubicazione_id` | opzionale |
        | `SPOSTAMENTO` | `ubicazione_da_id` + `ubicazione_a_id` (devono essere diversi) | opzionale |

        `quantita` è sempre un intero positivo ≥ 1.
        Per SPOSTAMENTO, `ubicazione_da_id` e `ubicazione_a_id` sostituiscono `ubicazione_id`.
      properties:
        prodotto_id:
          type: integer
          minimum: 1
          example: 7
        ubicazione_id:
          type: integer
          minimum: 1
          example: 12
          description: "Richiesto per tutti i tipi eccetto SPOSTAMENTO."
        ubicazione_da_id:
          type: integer
          minimum: 1
          example: 12
          description: "Solo per SPOSTAMENTO: ubicazione di partenza."
        ubicazione_a_id:
          type: integer
          minimum: 1
          example: 15
          description: "Solo per SPOSTAMENTO: ubicazione di arrivo. Deve essere diversa da ubicazione_da_id."
        quantita:
          type: integer
          minimum: 1
          example: 10
        movimento_tipo:
          type: string
          enum: [CARICO_ACQUISTO, SCARICO_VENDITA, SPOSTAMENTO, RETTIFICA_POSITIVA, RETTIFICA_NEGATIVA, RESO]
          example: CARICO_ACQUISTO
        riferimento:
          type: string
          example: "ordine_acquisto:42"
          description: "Identificativo documento sorgente. Convenzione: {tipo}:{id}."
        note:
          type: string
          example: "Allineamento inventariale Q2 2026"
          description: "Obbligatorie per RETTIFICA_POSITIVA e RETTIFICA_NEGATIVA."

    SpostamentoResult:
      description: |
        Risposta per `movimento_tipo=SPOSTAMENTO`.
        Lo spostamento genera sempre **due record**: SCARICO sull'ubicazione di partenza e CARICO su quella di arrivo.
        Entrambi i record hanno `tipo=SPOSTAMENTO` e lo stesso `riferimento`.
      type: object
      properties:
        scarico: { $ref: '#/components/schemas/MovimentoStock' }
        carico:  { $ref: '#/components/schemas/MovimentoStock' }

    # ─── M08 — Ordini di Acquisto & Ricezioni ───
    StatoOrdineAcquisto:
      type: string
      enum: [BOZZA, INVIATO, CONFERMATO, IN_RICEZIONE, COMPLETATO, ANNULLATO]
      example: BOZZA
      description: |
        Ciclo di vita ordine. Transizioni consentite:
        BOZZA→INVIATO→CONFERMATO→IN_RICEZIONE→COMPLETATO. Da ogni stato non finale è possibile passare ad ANNULLATO.

    RigaPo:
      description: Riga di un ordine di acquisto (tabella `righe_po`).
      type: object
      properties:
        id:                { type: integer, example: 10 }
        prodotto_id:       { type: integer, example: 7 }
        prodotto:          { type: string,  example: "Valvola a sfera 1/2\"", description: "Nome prodotto (solo nelle GET con JOIN)" }
        quantita_ordinata: { type: number,  example: 100 }
        quantita_ricevuta: { type: number,  example: 0, description: "Cumulativa, aggiornata dalle ricezioni" }
        prezzo_unitario:   { type: number,  example: 12.50 }
        created_at:        { type: string,  format: date-time, example: "2026-06-09T09:00:00.000Z" }
        updated_at:        { type: string,  format: date-time, example: "2026-06-09T09:00:00.000Z" }

    OrdineAcquistoLista:
      description: Vista lista ordini (GET /ordini-acquisto) con aggregati calcolati.
      type: object
      properties:
        id:               { type: integer, example: 15 }
        fornitore_id:     { type: integer, example: 3 }
        fornitore:        { type: string,  example: "Acciaierie Lombarde S.p.A." }
        stato:            { $ref: '#/components/schemas/StatoOrdineAcquisto' }
        data_prevista:    { type: string, format: date, example: "2026-06-20", nullable: true }
        importo_totale:   { type: number, example: 1250.00 }
        note:             { type: string, example: "Consegna su bancali", nullable: true }
        utente_id:        { type: integer, example: 2, nullable: true }
        utente:           { type: string, example: "Mario Rossi", nullable: true }
        created_at:       { type: string, format: date-time, example: "2026-06-09T09:00:00.000Z" }
        updated_at:       { type: string, format: date-time, example: "2026-06-09T09:00:00.000Z" }
        totale_calcolato: { type: number, example: 1250.00, description: "SUM(quantita_ordinata * prezzo_unitario)" }
        numero_righe:     { type: integer, example: 2 }
        totale_ricevuto:  { type: number, example: 0, description: "SUM(quantita_ricevuta)" }

    OrdineAcquistoDettaglio:
      description: Dettaglio completo (GET /ordini-acquisto/:id) — ordine + righe + ricezioni.
      type: object
      properties:
        ordine:
          type: object
          properties:
            id:             { type: integer, example: 15 }
            fornitore_id:   { type: integer, example: 3 }
            fornitore:      { type: string,  example: "Acciaierie Lombarde S.p.A." }
            stato:          { $ref: '#/components/schemas/StatoOrdineAcquisto' }
            data_prevista:  { type: string, format: date, example: "2026-06-20", nullable: true }
            importo_totale: { type: number, example: 1250.00 }
            note:           { type: string, example: "Consegna su bancali", nullable: true }
            utente_id:      { type: integer, example: 2, nullable: true }
            utente:         { type: string, example: "Mario Rossi", nullable: true }
            created_at:     { type: string, format: date-time, example: "2026-06-09T09:00:00.000Z" }
            updated_at:     { type: string, format: date-time, example: "2026-06-09T09:00:00.000Z" }
        righe:
          type: array
          items: { $ref: '#/components/schemas/RigaPo' }
        ricezioni:
          type: array
          items:
            type: object
            properties:
              id:             { type: integer, example: 5 }
              data_ricezione: { type: string, format: date-time, example: "2026-06-18T11:00:00.000Z" }
              note:           { type: string, example: null, nullable: true }
              utente_id:      { type: integer, example: 2, nullable: true }
              utente:         { type: string, example: "Mario Rossi", nullable: true }
              created_at:     { type: string, format: date-time, example: "2026-06-18T11:00:00.000Z" }
              updated_at:     { type: string, format: date-time, example: "2026-06-18T11:00:00.000Z" }

    OrdineAcquistoCreateRequest:
      type: object
      required: [fornitore_id, righe]
      description: Crea un ordine in stato BOZZA. `importo_totale` è calcolato dal server dalle righe.
      properties:
        fornitore_id:  { type: integer, minimum: 1, example: 3 }
        data_prevista: { type: string, format: date, example: "2026-06-20", description: "Opzionale" }
        note:          { type: string, example: "Consegna su bancali" }
        utente_id:     { type: integer, minimum: 1, example: 2, description: "Utente che emette l'ordine" }
        righe:
          type: array
          minItems: 1
          items:
            type: object
            required: [prodotto_id, quantita_ordinata, prezzo_unitario]
            properties:
              prodotto_id:       { type: integer, minimum: 1, example: 7 }
              quantita_ordinata: { type: number, minimum: 0.01, example: 100 }
              prezzo_unitario:   { type: number, minimum: 0, example: 12.50 }

    OrdineAcquistoUpdateRequest:
      type: object
      description: Tutti i campi opzionali. Non consentito su ordini COMPLETATO o ANNULLATO.
      properties:
        fornitore_id:   { type: integer, minimum: 1, example: 3 }
        data_prevista:  { type: string, format: date, example: "2026-06-22" }
        importo_totale: { type: number, minimum: 0, example: 1300.00 }
        note:           { type: string, example: "Aggiornata data consegna" }
        utente_id:      { type: integer, minimum: 1, example: 2 }

    OrdineAcquistoStatoRequest:
      type: object
      required: [stato]
      properties:
        stato: { $ref: '#/components/schemas/StatoOrdineAcquisto' }

    RigaPoCreateRequest:
      type: object
      required: [prodotto_id, quantita_ordinata, prezzo_unitario]
      description: Aggiunge una riga. Consentito solo su ordini in stato BOZZA, INVIATO o CONFERMATO.
      properties:
        prodotto_id:       { type: integer, minimum: 1, example: 8 }
        quantita_ordinata: { type: number, minimum: 0.01, example: 50 }
        prezzo_unitario:   { type: number, minimum: 0, example: 9.90 }

    RigaRicezione:
      description: Riga di una ricezione (tabella `righe_ricezione`).
      type: object
      properties:
        id:                { type: integer, example: 30 }
        ricezione_id:      { type: integer, example: 5 }
        prodotto_id:       { type: integer, example: 7 }
        sku:               { type: string,  example: "ACQ-SKU-001" }
        prodotto:          { type: string,  example: "Valvola a sfera 1/2\"" }
        quantita_ricevuta: { type: number,  example: 40 }
        ubicazione_id:     { type: integer, example: 12 }
        ubicazione:        { type: string,  example: "1-02-05" }
        magazzino:         { type: string,  example: "Magazzino Centrale" }
        created_at:        { type: string,  format: date-time, example: "2026-06-18T11:00:00.000Z" }
        updated_at:        { type: string,  format: date-time, example: "2026-06-18T11:00:00.000Z" }

    Ricezione:
      description: Testata ricezione (tabella `ricezioni`).
      type: object
      properties:
        id:               { type: integer, example: 5 }
        ordine_acquisto_id: { type: integer, example: 15 }
        stato_ordine:     { $ref: '#/components/schemas/StatoOrdineAcquisto' }
        fornitore_id:     { type: integer, example: 3 }
        fornitore:        { type: string,  example: "Acciaierie Lombarde S.p.A." }
        data_ricezione:   { type: string, format: date-time, example: "2026-06-18T11:00:00.000Z" }
        note:             { type: string, example: null, nullable: true }
        utente_id:        { type: integer, example: 2, nullable: true }
        utente:           { type: string, example: "Mario Rossi", nullable: true }
        created_at:       { type: string, format: date-time, example: "2026-06-18T11:00:00.000Z" }
        updated_at:       { type: string, format: date-time, example: "2026-06-18T11:00:00.000Z" }

    RicezioneOrdineCreateRequest:
      type: object
      required: [ordine_acquisto_id, righe]
      description: |
        Registra una ricezione su un ordine (POST /ordini-acquisto/ricezioni).
        Genera per ogni riga un movimento stock `CARICO_ACQUISTO`, incrementa `quantita_ricevuta`
        e porta l'ordine in IN_RICEZIONE o COMPLETATO. Consentito solo su ordini CONFERMATO o IN_RICEZIONE.
      properties:
        ordine_acquisto_id: { type: integer, minimum: 1, example: 15 }
        data_ricezione:     { type: string, format: date-time, example: "2026-06-18T11:00:00.000Z", description: "Default NOW() se omesso" }
        note:               { type: string, example: "Ricevuto con DDT 2026-0031" }
        utente_id:          { type: integer, minimum: 1, example: 2 }
        righe:
          type: array
          minItems: 1
          items:
            type: object
            required: [prodotto_id, quantita_ricevuta, ubicazione_id]
            properties:
              prodotto_id:       { type: integer, minimum: 1, example: 7 }
              quantita_ricevuta: { type: number, minimum: 0.01, example: 40 }
              ubicazione_id:     { type: integer, minimum: 1, example: 12 }

    RicezioneCreateRequest:
      type: object
      required: [ordine_acquisto_id, data_ricezione]
      description: Crea la sola testata ricezione (POST /ricezioni). Le righe si aggiungono con POST /ricezioni/:id/righe.
      properties:
        ordine_acquisto_id: { type: integer, minimum: 1, example: 15 }
        data_ricezione:     { type: string, format: date-time, example: "2026-06-18T11:00:00.000Z" }
        note:               { type: string, example: "Ricevuto con DDT 2026-0031" }

    RigaRicezioneCreateRequest:
      type: object
      required: [prodotto_id, quantita, ubicazione_id]
      description: Aggiunge una riga a una ricezione (POST /ricezioni/:id/righe) e genera il relativo movimento CARICO_ACQUISTO.
      properties:
        prodotto_id:   { type: integer, minimum: 1, example: 7 }
        quantita:      { type: number, minimum: 0.01, example: 40 }
        ubicazione_id: { type: integer, minimum: 1, example: 12 }

    Ordine:
      description: Testata di un ordine di vendita.
      type: object
      properties:
        id:                      { type: integer, example: 31 }
        cliente_id:              { type: integer, example: 4 }
        cliente:                 { type: string,  example: "Rossi Costruzioni S.r.l.", description: "Ragione sociale (join), presente nelle liste" }
        destinazione_id:         { type: integer, example: 9 }
        stato:
          type: string
          enum: [BOZZA, CONFERMATO, SPEDITO, ANNULLATO]
          example: BOZZA
        stato_picking:
          type: string
          enum: [NON_AVVIATO, IN_PICKING, PICKING_COMPLETATO]
          example: NON_AVVIATO
        data_ordine:             { type: string, format: date-time, example: "2026-06-10T09:00:00.000Z" }
        data_consegna_richiesta: { type: string, format: date, nullable: true, example: "2026-06-20" }
        importo_totale:          { type: number, example: 1540.00 }
        utente_id:               { type: integer, nullable: true, example: 6 }
        created_at:              { type: string, format: date-time, example: "2026-06-10T09:00:00.000Z" }
        updated_at:              { type: string, format: date-time, example: "2026-06-10T09:00:00.000Z" }

    RigaOrdine:
      description: Riga di dettaglio di un ordine di vendita.
      type: object
      properties:
        id:              { type: integer, example: 80 }
        ordine_id:       { type: integer, example: 31 }
        prodotto_id:     { type: integer, example: 7 }
        sku:             { type: string,  example: VLV-001 }
        prodotto:        { type: string,  example: "Valvola a sfera 1/2\"" }
        quantita:        { type: integer, example: 50 }
        prezzo_unitario: { type: number,  nullable: true, example: 12.50 }
        created_at:      { type: string, format: date-time, example: "2026-06-10T09:00:00.000Z" }
        updated_at:      { type: string, format: date-time, example: "2026-06-10T09:00:00.000Z" }

    OrdineDettaglio:
      description: Ordine con le sue righe.
      type: object
      properties:
        ordine: { $ref: '#/components/schemas/Ordine' }
        righe:
          type: array
          items: { $ref: '#/components/schemas/RigaOrdine' }

    OrdineCreateRequest:
      type: object
      required: [cliente_id, destinazione_id, righe]
      description: |
        Crea un ordine in stato BOZZA con le sue righe.
        `utente_id` è derivato dal token (non accettato dal body).
        `importo_totale` è calcolato server-side dalla somma quantita × prezzo_unitario delle righe.
        La destinazione deve appartenere al cliente indicato.
      properties:
        cliente_id:              { type: integer, minimum: 1, example: 4 }
        destinazione_id:         { type: integer, minimum: 1, example: 9 }
        data_consegna_richiesta: { type: string, format: date, example: "2026-06-20" }
        righe:
          type: array
          minItems: 1
          items:
            type: object
            required: [prodotto_id, quantita]
            properties:
              prodotto_id:     { type: integer, minimum: 1, example: 7 }
              quantita:        { type: integer, minimum: 1, example: 50 }
              prezzo_unitario: { type: number, example: 12.50 }

    OrdineUpdateRequest:
      type: object
      description: Modifica consentita solo in stato BOZZA. Solo data_consegna_richiesta è modificabile.
      properties:
        data_consegna_richiesta: { type: string, format: date, example: "2026-06-22" }

    OrdineStatoRequest:
      type: object
      required: [stato]
      description: |
        Transizione di stato commerciale. Transizioni ammesse:
        BOZZA → CONFERMATO | ANNULLATO; CONFERMATO → SPEDITO | ANNULLATO.
        Alla CONFERMA viene verificata la disponibilità (totale − impegnato): se insufficiente → 422.
        Il passaggio a SPEDITO richiede stato_picking = PICKING_COMPLETATO.
      properties:
        stato:
          type: string
          enum: [BOZZA, CONFERMATO, SPEDITO, ANNULLATO]
          example: CONFERMATO

    OrdinePickingRequest:
      type: object
      required: [stato_picking]
      description: |
        Avanzamento del picking. Transizioni: NON_AVVIATO → IN_PICKING → PICKING_COMPLETATO.
        Gestibile solo su ordini in stato CONFERMATO.
        Per `stato_picking=PICKING_COMPLETATO` è obbligatorio il campo `prelievi`: per ogni riga
        la somma delle quantità prelevate deve corrispondere alla quantità ordinata.
        Al completamento viene generato un movimento SCARICO_VENDITA per ciascuna ubicazione di prelievo.
      properties:
        stato_picking:
          type: string
          enum: [NON_AVVIATO, IN_PICKING, PICKING_COMPLETATO]
          example: PICKING_COMPLETATO
        prelievi:
          type: array
          description: Obbligatorio solo quando stato_picking = PICKING_COMPLETATO.
          items:
            type: object
            required: [riga_id, ubicazioni]
            properties:
              riga_id: { type: integer, example: 80 }
              ubicazioni:
                type: array
                minItems: 1
                items:
                  type: object
                  required: [ubicazione_id, quantita]
                  properties:
                    ubicazione_id: { type: integer, example: 12 }
                    quantita:      { type: integer, minimum: 1, example: 30 }

    Disponibilita:
      description: |
        Disponibilità commerciale di un prodotto. `disponibile = totale − impegnato`.
        `impegnato` = somma delle quantità di righe appartenenti a ordini CONFERMATO non ancora
        a PICKING_COMPLETATO (calcolo runtime, nessuna colonna materializzata).
      type: object
      properties:
        prodotto_id: { type: integer, example: 7 }
        totale:      { type: integer, example: 120, description: "Somma giacenza fisica su tutte le ubicazioni" }
        impegnato:   { type: integer, example: 50,  description: "Quantità riservata da ordini confermati non prelevati" }
        disponibile: { type: integer, example: 70 }

    PickingResult:
      description: Risposta al completamento picking — ordine aggiornato + movimenti di scarico generati.
      type: object
      properties:
        ordine: { $ref: '#/components/schemas/Ordine' }
        movimenti:
          type: array
          items: { $ref: '#/components/schemas/MovimentoStock' }

    Destinazione:
      description: Indirizzo di consegna associato a un cliente.
      type: object
      properties:
        id:          { type: integer, example: 9 }
        cliente_id:  { type: integer, example: 4 }
        etichetta:   { type: string, nullable: true, example: "Sede operativa" }
        indirizzo:   { type: string, nullable: true, example: "Via Roma 1" }
        cap:         { type: string, nullable: true, example: "20100" }
        citta:       { type: string, nullable: true, example: "Milano" }
        provincia:   { type: string, nullable: true, example: "MI" }
        paese:       { type: string, nullable: true, example: "Italia" }
        predefinita: { type: boolean, example: true }
        created_at:  { type: string, format: date-time }
        updated_at:  { type: string, format: date-time }

    DestinazioneRequest:
      type: object
      description: Tutti i campi opzionali tranne nessuno obbligatorio; cliente_id deriva dal path.
      properties:
        etichetta:   { type: string, example: "Sede operativa" }
        indirizzo:   { type: string, example: "Via Roma 1" }
        cap:         { type: string, example: "20100" }
        citta:       { type: string, example: "Milano" }
        provincia:   { type: string, example: "MI" }
        paese:       { type: string, example: "Italia" }
        predefinita: { type: boolean, example: false }

# ─────────────────────────────────────────────
# SECURITY DEFAULT
# ─────────────────────────────────────────────
security:
  - BearerAuth: []

# ─────────────────────────────────────────────
# PATHS
# ─────────────────────────────────────────────
paths:

  # ══════════════════════════════════════════
  # M01 — AUTH
  # ══════════════════════════════════════════

  /auth/login:
    post:
      tags: [Auth]
      summary: Login utente
      description: Restituisce un token JWT e il profilo dell'utente autenticato.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            examples:
              admin:
                summary: Login admin
                value: { email: admin@logichain.it, password: password123 }
              operatore:
                summary: Login operatore
                value: { email: giuseppe.esposito@logichain.it, password: sicura456 }
      responses:
        "200":
          description: Login riuscito
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data:   { $ref: '#/components/schemas/LoginResponse' }
              example:
                status: success
                data:
                  token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6MSwiaWF0IjoxNzE3ODUwMDAwfQ.abc123
                  utente:
                    id: 1
                    nome: Admin
                    cognome: LogiChain
                    email: admin@logichain.it
                    ruolo_id: 1
                    ruolo_nome: Admin
                    created_at: "2026-01-10T08:00:00.000Z"
                    updated_at: "2026-01-10T08:00:00.000Z"
        "400": { $ref: '#/components/responses/ValidationError' }
        "401":
          description: Credenziali errate
          content:
            application/json:
              example:
                status: error
                code: AUTH_REQUIRED
                message: Credenziali non valide
                details: []

  /auth/register:
    post:
      tags: [Auth]
      summary: Registra un nuovo utente
      description: |
        Richiede permesso `utenti:write` (solo Admin).
        Crea un nuovo account utente nel sistema.
      x-required-permission: utenti:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
            example:
              nome: Laura
              cognome: Ferretti
              email: laura.ferretti@logichain.it
              password: sicura456
              ruolo_id: 3
      responses:
        "201":
          description: Utente creato
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data:   { $ref: '#/components/schemas/Utente' }
              example:
                status: success
                data:
                  id: 9
                  nome: Laura
                  cognome: Ferretti
                  email: laura.ferretti@logichain.it
                  ruolo_id: 3
                  ruolo_nome: Responsabile Magazzino
                  created_at: "2026-06-07T09:15:00.000Z"
                  updated_at: "2026-06-07T09:15:00.000Z"
        "400": { $ref: '#/components/responses/ValidationError' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409":
          description: Email già registrata
          content:
            application/json:
              example:
                status: error
                code: DUPLICATE_ENTRY
                message: Email già in uso
                details: []

  /auth/me:
    get:
      tags: [Auth]
      summary: Profilo utente corrente
      description: Restituisce i dati dell'utente associato al token JWT.
      responses:
        "200":
          description: Profilo utente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data:   { $ref: '#/components/schemas/Utente' }
              example:
                status: success
                data:
                  id: 2
                  nome: Marco
                  cognome: Bianchi
                  email: marco.bianchi@logichain.it
                  ruolo_id: 2
                  ruolo_nome: Responsabile Acquisti
                  created_at: "2026-02-01T08:00:00.000Z"
                  updated_at: "2026-02-01T08:00:00.000Z"
        "401": { $ref: '#/components/responses/Unauthorized' }

  /auth/password:
    patch:
      tags: [Auth]
      summary: Cambia la propria password
      description: |
        Permette all'utente autenticato di cambiare la propria password.
        Richiede la password attuale per verifica. Nessun permesso RBAC aggiuntivo.
        `password_nuova` deve essere diversa da `password_attuale`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
            example:
              password_attuale: vecchiaPassword1!
              password_nuova: NuovaPassword2!
      responses:
        "204": { $ref: '#/components/responses/NoContent' }
        "400": { $ref: '#/components/responses/ValidationError' }
        "401":
          description: Token mancante o password attuale errata
          content:
            application/json:
              examples:
                token_mancante:
                  summary: Token non fornito
                  value: { status: error, code: AUTH_REQUIRED, message: Autenticazione richiesta, details: [] }
                password_sbagliata:
                  summary: Password attuale errata
                  value: { status: error, code: PASSWORD_NON_VALIDA, message: "La password attuale non è corretta", details: [] }

  # ══════════════════════════════════════════
  # M01 (ext) — UTENTI (parziale)
  # ══════════════════════════════════════════

  /utenti/{id}/password:
    patch:
      tags: [Utenti]
      summary: Reset password utente (admin)
      description: |
        Forza il cambio password di un utente specifico.
        Non richiede la password attuale — è un reset amministrativo.
        Richiede permesso `utenti:write` (Admin, Dev).
      x-required-permission: utenti:write
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
          example: 5
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminResetPasswordRequest' }
            example:
              password_nuova: ResetPassword3!
      responses:
        "204": { $ref: '#/components/responses/NoContent' }
        "400": { $ref: '#/components/responses/ValidationError' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  # ══════════════════════════════════════════
  # M02 — PRODOTTI
  # ══════════════════════════════════════════

  /prodotti:
    get:
      tags: [Prodotti]
      summary: Lista prodotti (listino)
      description: |-
        Restituisce la lista di tutti i prodotti (inclusi disattivi — filtrabile lato client).
        Vista ridotta: `id`, `sku`, `nome`, `prezzo`, `data_agg_prezzo`, `attivo`, `created_at`.
        Richiede permesso `prodotti:read`.
      x-required-permission: prodotti:read
      responses:
        "200":
          description: Lista prodotti
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ProdottoListino' }
              example:
                status: success
                data:
                  - { id: 1, sku: VLV-001, nome: "Valvola a sfera 1/2\"", prezzo: 12.50, data_agg_prezzo: "2026-05-15T10:30:00.000Z", attivo: true, created_at: "2026-01-20T09:00:00.000Z" }
                  - { id: 2, sku: TUB-INOX-050, nome: "Tubo in acciaio inox DN50", prezzo: 48.00, data_agg_prezzo: "2026-04-20T14:00:00.000Z", attivo: true, created_at: "2026-02-10T10:00:00.000Z" }
                  - { id: 3, sku: GUA-NBR-32, nome: "Guarnizione NBR 32mm", prezzo: 2.80, data_agg_prezzo: "2026-03-01T09:00:00.000Z", attivo: false, created_at: "2026-01-25T11:00:00.000Z" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

    post:
      tags: [Prodotti]
      summary: Crea un nuovo prodotto
      description: |
        Richiede permesso `prodotti:write`.
        `sku` deve essere univoco tra i prodotti attivi.
        `prezzo` deve essere > 0.
      x-required-permission: prodotti:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProdottoCreateRequest' }
            example:
              nome: "Raccordo a T 3/4\""
              sku: RAC-T-034
              prezzo: 6.90
              descrizione: "Raccordo a T in ottone filettato 3/4\""
              categoria_id: 2
              unita_misura: pz
              peso_kg: 0.12
              scorta_minima: 20
      responses:
        "201":
          description: Prodotto creato
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data:   { $ref: '#/components/schemas/Prodotto' }
              example:
                status: success
                data:
                  id: 8
                  sku: RAC-T-034
                  nome: "Raccordo a T 3/4\""
                  descrizione: "Raccordo a T in ottone filettato 3/4\""
                  categoria_id: 2
                  categoria: null
                  unita_misura: pz
                  peso_kg: 0.12
                  scorta_minima: 20
                  prezzo: 6.90
                  data_agg_prezzo: "2026-06-07T11:00:00.000Z"
                  attivo: true
                  created_at: "2026-06-07T11:00:00.000Z"
                  updated_at: "2026-06-07T11:00:00.000Z"
        "400": { $ref: '#/components/responses/ValidationError' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409": { $ref: '#/components/responses/DuplicateEntry' }

  /prodotti/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
        example: 1

    get:
      tags: [Prodotti]
      summary: Dettaglio prodotto
      description: |
        Restituisce il profilo completo del prodotto incluso join categoria.
        Richiede permesso `prodotti:read`.
      x-required-permission: prodotti:read
      responses:
        "200":
          description: Dettaglio prodotto
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data:   { $ref: '#/components/schemas/Prodotto' }
              example:
                status: success
                data:
                  id: 1
                  sku: VLV-001
                  nome: "Valvola a sfera 1/2\""
                  descrizione: "Valvola in ottone per impianti idraulici. Temperatura max 120°C."
                  categoria_id: 3
                  categoria: Valvolame
                  unita_misura: pz
                  peso_kg: 0.35
                  scorta_minima: 50
                  prezzo: 12.50
                  data_agg_prezzo: "2026-05-15T10:30:00.000Z"
                  attivo: true
                  created_at: "2026-01-20T09:00:00.000Z"
                  updated_at: "2026-05-15T10:30:00.000Z"
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

    patch:
      tags: [Prodotti]
      summary: Aggiorna prodotto (parziale)
      description: |
        Richiede permesso `prodotti:write`.
        Inviare solo i campi da modificare.
        Se `prezzo` viene modificato, `data_agg_prezzo` viene aggiornata automaticamente dal trigger DB (`trg_data_agg_prezzo`).
        Il campo `attivo` può essere aggiornato qui (re-attivazione o disattivazione senza DELETE).
      x-required-permission: prodotti:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProdottoUpdateRequest' }
            example:
              prezzo: 14.00
      responses:
        "200":
          description: Prodotto aggiornato
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data:   { $ref: '#/components/schemas/Prodotto' }
              example:
                status: success
                data:
                  id: 1
                  sku: VLV-001
                  nome: "Valvola a sfera 1/2\""
                  descrizione: "Valvola in ottone per impianti idraulici. Temperatura max 120°C."
                  categoria_id: 3
                  categoria: null
                  unita_misura: pz
                  peso_kg: 0.35
                  scorta_minima: 50
                  prezzo: 14.00
                  data_agg_prezzo: "2026-06-07T12:00:00.000Z"
                  attivo: true
                  created_at: "2026-01-20T09:00:00.000Z"
                  updated_at: "2026-06-07T12:00:00.000Z"
        "400": { $ref: '#/components/responses/ValidationError' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/DuplicateEntry' }

    delete:
      tags: [Prodotti]
      summary: Elimina prodotto (soft delete)
      description: |
        Richiede permesso `prodotti:delete`.
        Imposta `attivo=false`. Il prodotto non appare più nella lista.
      x-required-permission: prodotti:delete
      responses:
        "204": { $ref: '#/components/responses/NoContent' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  # ══════════════════════════════════════════
  # M02 (ext) — CATEGORIE PRODOTTI
  # ══════════════════════════════════════════

  /categorie:
    get:
      tags: [Categorie]
      summary: Lista tutte le categorie
      description: |
        Restituisce tutte le categorie con join padre e conteggio prodotti attivi.
        Le categorie radice (senza padre) appaiono prima, ordinate per nome.
      x-required-permission: prodotti:read
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Lista categorie
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Categoria' }
              example:
                status: success
                data:
                  - id: 1
                    nome: Componentistica
                    categoria_padre_id: null
                    categoria_padre_nome: null
                    prodotti_count: 4
                    created_at: "2026-01-10T08:00:00.000Z"
                    updated_at: "2026-01-10T08:00:00.000Z"
                  - id: 3
                    nome: Valvolame
                    categoria_padre_id: 1
                    categoria_padre_nome: Componentistica
                    prodotti_count: 8
                    created_at: "2026-01-12T09:00:00.000Z"
                    updated_at: "2026-01-12T09:00:00.000Z"
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

    post:
      tags: [Categorie]
      summary: Crea una nuova categoria
      description: |
        Crea una categoria radice o una sottocategoria.
        Il nome deve essere univoco (case-insensitive).
        Massimo 2 livelli di profondità (radice → sottocategoria).
      x-required-permission: prodotti:write
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoriaCreateRequest' }
            examples:
              radice:
                summary: Categoria radice
                value: { nome: Raccorderia }
