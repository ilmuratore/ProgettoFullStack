        "200":
          description: Ordine aggiornato
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data:   { $ref: '#/components/schemas/Ordine' }
        "400": { $ref: '#/components/responses/ValidationError' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409":
          description: Ordine non in stato BOZZA
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /ordini/{id}/stato:
    patch:
      tags: [Ordini]
      summary: Cambia stato commerciale
      description: |
        Transizioni BOZZA→CONFERMATO/ANNULLATO, CONFERMATO→SPEDITO/ANNULLATO.
        Alla conferma controlla la disponibilità (422 se insufficiente).
        SPEDITO richiede picking completato. Richiede `ordini:approve`.
      x-required-permission: ordini:approve
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrdineStatoRequest' }
      responses:
        "200":
          description: Stato aggiornato
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data:   { $ref: '#/components/schemas/Ordine' }
        "400": { $ref: '#/components/responses/ValidationError' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409":
          description: Transizione di stato non consentita
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "422": { $ref: '#/components/responses/InsufficientStock' }

  /ordini/{id}/picking:
    patch:
      tags: [Ordini]
      summary: Avanza picking (scarico al completamento)
      description: |
        NON_AVVIATO→IN_PICKING→PICKING_COMPLETATO. Solo su ordini CONFERMATO.
        A PICKING_COMPLETATO richiede `prelievi` e genera gli SCARICO_VENDITA.
        Richiede `ordini:approve` (Resp. Magazzino / Resp. Vendite / Resp. Azienda).
      x-required-permission: ordini:approve
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrdinePickingRequest' }
      responses:
        "200":
          description: Picking aggiornato (con movimenti se completato)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data:   { $ref: '#/components/schemas/PickingResult' }
        "400": { $ref: '#/components/responses/ValidationError' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409":
          description: Transizione picking non consentita o ordine non CONFERMATO
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "422": { $ref: '#/components/responses/InsufficientStock' }

