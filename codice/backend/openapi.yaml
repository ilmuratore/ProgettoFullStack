        "201":
          description: Magazzino creato
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data:   { $ref: '#/components/schemas/Magazzino' }
              example:
                status: success
                data:
                  id: 3
