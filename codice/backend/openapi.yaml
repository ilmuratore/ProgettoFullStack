                  telefono: "030 1234567"
                  lead_time_giorni: null
                  source: manual
                  sito_web: "https://www.metallieco.it"
                  descrizione_aziendale: "Fornitura di acciai speciali e leghe per l'industria."
                  attivo: true
                  created_at: "2026-06-07T11:30:00.000Z"
                  updated_at: "2026-06-07T11:30:00.000Z"
        "400": { $ref: '#/components/responses/ValidationError' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409": { $ref: '#/components/responses/DuplicateEntry' }

  /fornitori/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
        example: 1

    get:
      tags: [Fornitori]
      summary: Dettaglio fornitore
      x-required-permission: fornitori:read
      responses:
        "200":
          description: Dettaglio fornitore
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data:   { $ref: '#/components/schemas/Fornitore' }
              example:
                status: success
                data:
                  id: 1
                  ragione_sociale: "Tecnofluid S.r.l."
                  piva: "02345678901"
                  indirizzo: "Via dell'Industria 22, 20090 Segrate MI"
                  email: acquisti@tecnofluid.it
                  telefono: "02 9876543"
                  lead_time_giorni: 7
                  source: manual
                  sito_web: "https://www.tecnofluid.it"
                  descrizione_aziendale: "Distributore di componentistica idraulica e pneumatica per l'industria manifatturiera."
                  attivo: true
                  created_at: "2026-02-10T10:00:00.000Z"
                  updated_at: "2026-02-10T10:00:00.000Z"
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

    patch:
      tags: [Fornitori]
      summary: Aggiorna fornitore (parziale)
      description: |
        Richiede permesso `fornitori:write`.
        **Attenzione**: se il fornitore ha `source=ecosystem` il server risponde 403.
        Il pulsante Modifica deve essere nascosto lato frontend per i fornitori ecosystem.
      x-required-permission: fornitori:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FornitoreUpdateRequest' }
            example:
              email: nuovo@tecnofluid.it
              telefono: "02 0000000"
      responses:
        "200":
          description: Fornitore aggiornato
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data:   { $ref: '#/components/schemas/Fornitore' }
        "400": { $ref: '#/components/responses/ValidationError' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403":
          description: |
            Permesso insufficiente **oppure** fornitore con `source=ecosystem` (non modificabile)
          content:
            application/json:
              example:
                status: error
                code: ACCESS_DENIED
                message: I fornitori dell'ecosistema non possono essere modificati manualmente
                details: []
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/DuplicateEntry' }

    delete:
      tags: [Fornitori]
      summary: Elimina fornitore (soft delete)
      description: |
        Richiede permesso `fornitori:delete`.
        Soft delete (`attivo=false`) per entrambi i `source`. Non rimuove il fornitore dall'ecosistema globale.
      x-required-permission: fornitori:delete
      responses:
        "204": { $ref: '#/components/responses/NoContent' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

