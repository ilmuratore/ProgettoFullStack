  # ══════════════════════════════════════════
  # M09 — ORDINI DI VENDITA (Sales Orders)
  # ══════════════════════════════════════════

  /ordini:
    get:
      tags: [Ordini]
      summary: Lista ordini di vendita
      description: |
        Restituisce gli ordini di vendita. Filtri opzionali via query: `stato`, `cliente_id`.
        Richiede permesso `ordini:read`.
      x-required-permission: ordini:read
      parameters:
        - name: stato
          in: query
          required: false
          schema: { $ref: '#/components/schemas/StatoOrdineVendita' }
        - name: cliente_id
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
          example: 1
      responses:
        "200":
          description: Lista ordini di vendita
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/OrdineVenditaLista' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

    post:
      tags: [Ordini]
      summary: Crea ordine di vendita
      description: |
        Crea un ordine in stato `BOZZA` con le sue righe in una transazione.
        Il prezzo di ogni riga è preso dal listino prodotto; `importo_totale` è calcolato dal server.
        La destinazione deve appartenere al cliente. Richiede permesso `ordini:write`.
      x-required-permission: ordini:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrdineVenditaCreateRequest' }
            example:
              cliente_id: 1
              destinazione_id: 5
              data_consegna_richiesta: "2026-06-25"
              utente_id: 2
              righe:
                - { prodotto_id: 7, quantita: 10 }
                - { prodotto_id: 8, quantita: 5 }
      responses:
        "201":
          description: Ordine creato
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data:
                    type: object
                    properties:
                      ordine: { $ref: '#/components/schemas/OrdineVenditaLista' }
                      righe:
                        type: array
                        items: { $ref: '#/components/schemas/RigaOrdine' }
        "400": { $ref: '#/components/responses/ValidationError' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404":
          description: Cliente, destinazione o prodotto non trovato
          content:
            application/json:
              example: { status: error, code: RESOURCE_NOT_FOUND, message: Cliente non trovato, details: [] }

  /ordini/disponibilita/{prodotto_id}:
    parameters:
      - name: prodotto_id
        in: path
        required: true
        schema: { type: integer }
        example: 7
    get:
      tags: [Ordini]
      summary: Disponibilità prodotto
      description: |
        Restituisce totale giacenza, quantità impegnata su ordini e disponibile netto del prodotto.
        Richiede permesso `ordini:read`.
      x-required-permission: ordini:read
      responses:
        "200":
          description: Disponibilità prodotto
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data: { $ref: '#/components/schemas/DisponibilitaProdotto' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }


  /ordini/export:
    get:
      tags: [Ordini]
      summary: Esporta ordini di vendita in Excel
      description: Esporta gli ordini di vendita in formato XLSX/Excel. Richiede permesso `ordini:read`.
      x-required-permission: ordini:read
      responses:
        "200":
          description: File Excel ordini di vendita
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /ordini/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
        example: 88
    get:
      tags: [Ordini]
      summary: Dettaglio ordine di vendita
      description: Restituisce testata + righe. Richiede permesso `ordini:read`.
      x-required-permission: ordini:read
      responses:
        "200":
          description: Dettaglio ordine
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data: { $ref: '#/components/schemas/OrdineVenditaDettaglio' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

    patch:
      tags: [Ordini]
      summary: Modifica testata ordine
      description: Aggiorna i campi di testata. Richiede permesso `ordini:write`.
      x-required-permission: ordini:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrdineVenditaUpdateRequest' }
            example:
              data_consegna_richiesta: "2026-06-27"
      responses:
        "200":
          description: Ordine aggiornato
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data: { $ref: '#/components/schemas/OrdineVenditaLista' }
        "400": { $ref: '#/components/responses/ValidationError' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  /ordini/{id}/stato:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
        example: 88
    patch:
      tags: [Ordini]
      summary: Cambia stato ordine
      description: |
        Transizione di stato validata (vedi `StatoOrdineVendita`). Richiede permesso `ordini:approve`.
      x-required-permission: ordini:approve
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrdineVenditaStatoRequest' }
            example:
              stato: CONFERMATO
      responses:
        "200":
          description: Stato aggiornato
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data: { $ref: '#/components/schemas/OrdineVenditaLista' }
        "400": { $ref: '#/components/responses/ValidationError' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409":
          description: Transizione di stato non valida
          content:
            application/json:
              example: { status: error, code: STATE_TRANSITION_INVALID, message: Transizione di stato non valida, details: [] }

  /ordini/{id}/picking:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
        example: 88
    patch:
      tags: [Ordini]
      summary: Aggiorna stato picking
      description: |
        Avanza la macchina stato picking. Per `PICKING_COMPLETATO` è obbligatorio l'array `prelievi`:
        ogni riga deve essere coperta da una o più ubicazioni di prelievo la cui somma uguagli la quantità
        ordinata. Ogni prelievo genera un movimento `SCARICO_VENDITA`. Richiede permesso `ordini:approve`.
      x-required-permission: ordini:approve
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrdinePickingRequest' }
            examples:
              avvio:
                summary: Avvio picking
                value: { stato_picking: IN_PICKING }
              completamento:
                summary: Completamento con prelievi
                value:
                  stato_picking: PICKING_COMPLETATO
                  prelievi:
                    - riga_id: 20
                      ubicazioni:
                        - { ubicazione_id: 12, quantita: 7 }
                        - { ubicazione_id: 15, quantita: 3 }
      responses:
        "200":
          description: Stato picking aggiornato
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data: { $ref: '#/components/schemas/OrdineVenditaLista' }
        "400": { $ref: '#/components/responses/ValidationError' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "422": { $ref: '#/components/responses/InsufficientStock' }


  /ordini-acquisto/export:
    get:
      tags: [OrdiniAcquisto]
      summary: Esporta ordini di acquisto in Excel
      description: Esporta gli ordini di acquisto in formato XLSX/Excel. Richiede permesso `acquisti:read`.
      x-required-permission: acquisti:read
      responses:
        "200":
          description: File Excel ordini di acquisto
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  # ══════════════════════════════════════════
  # M08 (ext) — PDF ORDINE DI ACQUISTO
  # ══════════════════════════════════════════

  /ordini-acquisto/{id}/pdf:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
        example: 15
      - name: download
        in: query
        required: false
        description: "`1` per forzare il download come allegato (Content-Disposition: attachment); altrimenti inline."
        schema: { type: string, enum: ["1"] }
        example: "1"
    get:
      tags: [OrdiniAcquisto]
      summary: Genera PDF ordine di acquisto
      description: |
        Restituisce il PDF dell'ordine di acquisto (`Content-Type: application/pdf`).
        Con `?download=1` il PDF è servito come allegato. Richiede permesso `acquisti:read`.
      x-required-permission: acquisti:read
      responses:
        "200":
          description: PDF ordine
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  # ══════════════════════════════════════════
  # M08 (ext) — INVIO EMAIL ORDINE DI ACQUISTO
  # ══════════════════════════════════════════

  /ordini-acquisto/{id}/invia-email:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
        example: 15
    post:
      tags: [OrdiniAcquisto]
      summary: Invia via email ordine di acquisto
      description: |
        Genera il PDF dell'ordine di acquisto, allega opzionalmente la contabile del bonifico
        e invia l'email al fornitore.

        Comportamento lato server:
        - il PDF ordine viene sempre generato e allegato automaticamente;
        - `contabile` è opzionale e accetta PDF/JPG/PNG/WEBP;
        - se `to` non viene inviato, viene usata l'email del fornitore;
        - se l'ordine è in stato `BOZZA` e l'invio riesce, lo stato passa a `INVIATO`;
        - viene registrato un log dell'invio consultabile con `GET /ordini-acquisto/{id}/email-log`.

        Richiede permesso `acquisti:write`.
      x-required-permission: acquisti:write
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/OrdineAcquistoEmailRequest' }
            encoding:
              contabile:
                contentType: application/pdf, image/jpeg, image/png, image/webp
            examples:
              solo_pdf:
                summary: Invio solo PDF ordine
                value:
                  to: fornitore@example.com
                  cc: acquisti@logichain.it
                  subject: Ordine di acquisto PO-15
                  message: Buongiorno, in allegato trasmettiamo il nostro ordine di acquisto.
              pdf_con_contabile:
                summary: Invio PDF ordine + contabile bonifico
                value:
                  to: fornitore@example.com
                  cc: acquisti@logichain.it
                  subject: Ordine di acquisto PO-15 e contabile bonifico
                  message: Buongiorno, in allegato trasmettiamo ordine e contabile del bonifico.
                  contabile: "<binary>"
      responses:
        "200":
          description: Email inviata correttamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data:   { $ref: '#/components/schemas/OrdineAcquistoEmailSendResult' }
              example:
                status: success
                data:
                  ordine_id: 15
                  stato_ordine_precedente: BOZZA
                  stato_ordine_corrente: INVIATO
                  email_log:
                    id: 27
                    ordine_acquisto_id: 15
                    message_id: "<smtp-message-id@example.com>"
                    provider: smtp
                    from: acquisti@logichain.it
                    to: fornitore@example.com
                    cc: acquisti@logichain.it
                    bcc: null
                    subject: Ordine di acquisto PO-15
                    message: Buongiorno, in allegato trasmettiamo ordine e contabile del bonifico.
                    status: SENT
                    errore: null
                    attachments:
                      - filename: ordine-acquisto-15.pdf
                        mime_type: application/pdf
                        size_bytes: 245760
                        kind: ORDINE_PDF
                      - filename: contabile-bonifico.pdf
                        mime_type: application/pdf
                        size_bytes: 184320
                        kind: CONTABILE
                    created_at: "2026-06-12T18:20:00.000Z"
                    sent_at: "2026-06-12T18:20:02.000Z"
        "400":
          description: Dati non validi, destinatario mancante o allegato non supportato
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                destinatario_mancante:
                  summary: Nessun destinatario disponibile
                  value:
                    status: error
                    code: VALIDATION_ERROR
                    message: Destinatario email mancante. Specificare `to` o valorizzare l'email del fornitore.
                    details:
                      - field: to
                        message: Destinatario obbligatorio se il fornitore non ha email
                file_non_supportato:
                  summary: Tipo file contabile non supportato
                  value:
                    status: error
                    code: UNSUPPORTED_FILE_TYPE
                    message: Tipo file non supportato. Sono ammessi PDF, JPG, PNG o WEBP.
                    details:
                      - field: contabile
                        message: Formato allegato non valido
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409":
          description: Ordine in stato incompatibile con l'invio email
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                status: error
                code: STATE_TRANSITION_INVALID
                message: Impossibile inviare email per un ordine annullato
                details: []
        "502": { $ref: '#/components/responses/EmailSendFailed' }

  /ordini-acquisto/{id}/email-log:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
        example: 15
    get:
      tags: [OrdiniAcquisto]
      summary: Lista invii email ordine acquisto
      description: |
        Restituisce lo storico degli invii email collegati all'ordine di acquisto.
        Include destinatari, oggetto, stato invio, allegati registrati, `message_id` provider
        ed eventuale errore in caso di invio fallito. Richiede permesso `acquisti:read`.
      x-required-permission: acquisti:read
      responses:
        "200":
          description: Lista log invii email
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/OrdineAcquistoEmailLog' }
              example:
                status: success
                data:
                  - id: 27
                    ordine_acquisto_id: 15
                    message_id: "<smtp-message-id@example.com>"
                    provider: smtp
                    from: acquisti@logichain.it
                    to: fornitore@example.com
                    cc: acquisti@logichain.it
                    bcc: null
                    subject: Ordine di acquisto PO-15
                    message: Buongiorno, in allegato trasmettiamo ordine e contabile del bonifico.
                    status: SENT
                    errore: null
                    attachments:
                      - filename: ordine-acquisto-15.pdf
                        mime_type: application/pdf
                        size_bytes: 245760
                        kind: ORDINE_PDF
                      - filename: contabile-bonifico.pdf
                        mime_type: application/pdf
