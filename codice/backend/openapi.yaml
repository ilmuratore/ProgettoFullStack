    get:
      tags: [Magazzini]
      summary: Dettaglio magazzino con ubicazioni
      description: |
        Restituisce il magazzino con l'albero completo delle ubicazioni.
        Ogni ubicazione include `totale_giacenza` (somma delle giacenze nello slot).
      x-required-permission: magazzino:read
      responses:
        "200":
          description: Dettaglio magazzino con ubicazioni
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
