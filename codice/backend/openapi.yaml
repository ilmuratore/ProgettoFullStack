        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  /magazzini/{magId}/ubicazioni:
    post:
      tags: [Ubicazioni]
      summary: Crea una nuova ubicazione in un magazzino
      description: |
        Rotta nested sotto `/magazzini/:magId/ubicazioni`.
        Il `codice` dell'ubicazione viene calcolato e storato automaticamente dal service.
        La combinazione `(corsia, scaffale)` deve essere univoca nel magazzino.
      x-required-permission: magazzino:write
      parameters:
        - name: magId
          in: path
          required: true
          schema: { type: integer }
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UbicazioneCreateRequest' }
            example:
              corsia: 3
              scaffale: 7
              temperatura_controllata: false
      responses:
        "201":
          description: Ubicazione creata
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data:   { $ref: '#/components/schemas/Ubicazione' }
              example:
                status: success
                data:
                  id: 15
                  magazzino_id: 1
                  corsia: 3
                  scaffale: 7
                  codice: 1-03-07
                  codice_composto: "MAG-A / 1-03-07"
                  attivo: true
                  temperatura_controllata: false
                  created_at: "2026-06-07T16:45:00.000Z"
                  updated_at: "2026-06-07T16:45:00.000Z"
        "400": { $ref: '#/components/responses/ValidationError' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404":
          description: Magazzino non trovato
          content:
            application/json:
              example:
                status: error
                code: RESOURCE_NOT_FOUND
                message: Magazzino non trovato
                details: []
        "409":
          description: Slot già occupato (stessa corsia+scaffale nel magazzino)
          content:
            application/json:
              example:
                status: error
                code: DUPLICATE_ENTRY
                message: "Ubicazione corsia 3 scaffale 7 già esistente in questo magazzino"
                details: []

