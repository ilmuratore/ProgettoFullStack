  /giacenze:
    get:
      tags: [Giacenze]
      summary: Lista giacenze con filtri
      description: |
        Restituisce le giacenze per prodotto/ubicazione, arricchite con `magazzino`, flag `sotto_scorta`
        e `ultimo_movimento`. Filtri opzionali via query. Richiede permesso `giacenze:read`.
      x-required-permission: giacenze:read
      parameters:
        - name: search
          in: query
          required: false
          description: Filtra per SKU o nome prodotto (ILIKE)
          schema: { type: string }
          example: "BOLT"
        - name: magazzino
          in: query
          required: false
          description: ID magazzino
          schema: { type: integer, minimum: 1 }
          example: 1
        - name: ubicazione
          in: query
          required: false
          description: Filtra per codice ubicazione (ILIKE)
          schema: { type: string }
          example: "A-01"
        - name: sotto_scorta
          in: query
          required: false
          description: Se valorizzato, restituisce solo giacenze con quantità sotto la scorta minima
          schema: { type: boolean }
          example: true
        - name: q_min
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
          example: 10
        - name: q_max
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
          example: 500
      responses:
        "200":
          description: Lista giacenze
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data:
