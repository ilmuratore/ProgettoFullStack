              required:
                - nome
      responses:
        '201':
          description: Creato
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /fornitori/{id}/contatti/{contattoId}:
    get:
      tags:
        - Fornitori
      summary: Dettaglio contatto
      description: 'Permesso richiesto: `fornitori:read`.'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: contattoId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Fornitori
      summary: Aggiorna contatto
      description: 'Permesso richiesto: `fornitori:write`.'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: contattoId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nome:
                  type: string
                  minLength: 1
                ruolo:
                  type: string
                email:
                  type: string
                telefono:
                  type: string
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /clienti:
    get:
      tags:
        - Clienti
      summary: Lista clienti attivi
      description: 'Permesso richiesto: `clienti:read`.'
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Clienti
      summary: Crea cliente (source forzato a manual)
      description: 'Permesso richiesto: `clienti:write`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
