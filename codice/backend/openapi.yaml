                  indirizzo: "Via dell'Artigianato 14"
                  cap: "20099"
                  citta: "Sesto San Giovanni"
                  provincia: MI
                  paese: Italia
                  attivo: true
                  created_at: "2026-01-10T08:00:00.000Z"
                  updated_at: "2026-01-10T08:00:00.000Z"
                  ubicazioni:
                    - id: 1
                      magazzino_id: 1
                      corsia: 1
                      scaffale: 1
                      codice: 1-01-01
                      codice_composto: "MAG-A / 1-01-01"
                      attivo: true
                      temperatura_controllata: false
                      totale_giacenza: 250
                      created_at: "2026-01-10T08:00:00.000Z"
                      updated_at: "2026-01-10T08:00:00.000Z"
                    - id: 2
                      magazzino_id: 1
                      corsia: 1
                      scaffale: 2
                      codice: 1-01-02
                      codice_composto: "MAG-A / 1-01-02"
                      attivo: true
                      temperatura_controllata: true
                      totale_giacenza: 0
                      created_at: "2026-01-10T08:00:00.000Z"
                      updated_at: "2026-01-10T08:00:00.000Z"
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

    patch:
      tags: [Magazzini]
      summary: Aggiorna magazzino
      description: |
        Aggiorna `nome` e/o `indirizzo`. `codice` non è modificabile.
      x-required-permission: magazzino:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MagazzinoUpdateRequest' }
            example:
              nome: "Magazzino principale Sesto — ampliato"
      responses:
        "200":
          description: Magazzino aggiornato
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
