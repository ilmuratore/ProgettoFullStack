  /ecosystem/search:
    get:
      tags: [Ecosystem]
      summary: Ricerca globale ecosistema
      description: |
        Ricerca full-text su prodotti (nome, SKU) e fornitori (ragione sociale, P.IVA).
        Restituisce al massimo 10 risultati per categoria. Parametro `q` minimo 2 caratteri.
        Richiede permesso `ecosystem:read`.
      x-required-permission: ecosystem:read
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2 }
          example: valvola
      responses:
        "200":
          description: Risultati ricerca
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data: { $ref: '#/components/schemas/EcosystemSearchResult' }
              example:
                status: success
                data:
                  prodotti:
                    - id: 7
                      sku: VLV-001
                      nome: "Valvola a sfera 1/2\""
                      prezzo: 12.50
                      giacenza_totale: 125
                  fornitori:
                    - id: 1
                      ragione_sociale: "Tecnofluid S.r.l."
                      piva: "02345678901"
                      source: manual
                      email: acquisti@tecnofluid.it
                      sito_web: "https://www.tecnofluid.it"
        "400":
          description: Parametro q mancante o troppo corto
          content:
            application/json:
              example: { status: error, code: VALIDATION_ERROR, message: "Parametro q minimo 2 caratteri", details: [] }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /ecosystem/fornitori/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
        example: 1
    get:
      tags: [Ecosystem]
      summary: Scheda fornitore ecosistema
      description: |
        Restituisce la scheda completa del fornitore: anagrafica, contatti, catalogo prodotti (da storico ordini)
        e ultime 10 richieste di acquisto. Richiede permesso `ecosystem:read`.
      x-required-permission: ecosystem:read
      responses:
        "200":
          description: Scheda fornitore
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
