              quantita_ordinata: 50
              prezzo_unitario: 9.90
      responses:
        "201":
          description: Riga aggiunta
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data: { $ref: '#/components/schemas/RigaPo' }
        "400": { $ref: '#/components/responses/ValidationError' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409":
          description: Non è possibile aggiungere righe nello stato corrente
          content:
            application/json:
              example:
                status: error
                code: STATE_TRANSITION_INVALID
                message: Non è possibile aggiungere righe nello stato corrente
                details: []

  /ordini-acquisto/{id}/ricezioni:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
        example: 15
    get:
      tags: [Ricezioni]
