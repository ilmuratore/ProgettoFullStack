              ordine_acquisto_id: 15
              data_ricezione: "2026-06-18T11:00:00.000Z"
              note: "Ricevuto con DDT 2026-0031"
      responses:
        "201":
          description: Testata ricezione creata
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data: { $ref: '#/components/schemas/Ricezione' }
        "400": { $ref: '#/components/responses/ValidationError' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /ricezioni/{id}:
    parameters:
      - name: id
