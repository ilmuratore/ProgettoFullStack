  # ══════════════════════════════════════════
  # M10 — SPEDIZIONI & DDT
  # ══════════════════════════════════════════

  /spedizioni:
    get:
      tags: [Spedizioni]
      summary: Lista spedizioni
      description: Restituisce tutte le spedizioni con dati cliente, destinazione e corriere. Richiede permesso `spedizioni:read`.
      x-required-permission: spedizioni:read
      responses:
        "200":
          description: Lista spedizioni
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Spedizione' }
              example:
                status: success
                data:
                  - id: 1
                    ordine_id: 88
                    cliente_id: 1
                    cliente: "Officine Manzoni S.r.l."
                    destinazione_id: 5
                    destinazione: "Sede operativa"
                    corriere_id: 2
                    corriere: "BRT Bartolini"
                    codice_corriere: BRT
                    stato: IN_PREPARAZIONE
                    tracking_number: null
                    created_at: "2026-06-10T09:00:00.000Z"
                    updated_at: "2026-06-10T09:00:00.000Z"
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Spedizioni]
      summary: Crea spedizione
      description: |
        Crea una spedizione in stato `IN_PREPARAZIONE`. L'ordine deve essere in stato `CONFERMATO` o `SPEDITO` (BUG-03 fix: ordine in BOZZA o ANNULLATO viene rifiutato con 409).
        Richiede permesso `spedizioni:write`.
      x-required-permission: spedizioni:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SpedizioneCreateRequest' }
            example:
              ordine_id: 88
              cliente_id: 1
              destinazione_id: 5
              corriere_id: 2
              tracking_number: null
      responses:
        "201":
          description: Spedizione creata
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data: { $ref: '#/components/schemas/Spedizione' }
        "400": { $ref: '#/components/responses/ValidationError' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  /spedizioni/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
        example: 1
    get:
      tags: [Spedizioni]
      summary: Dettaglio spedizione
      x-required-permission: spedizioni:read
      responses:
        "200":
          description: Dettaglio spedizione
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data: { $ref: '#/components/schemas/Spedizione' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  /spedizioni/{id}/stato:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
        example: 1
    patch:
      tags: [Spedizioni]
      summary: Cambia stato spedizione
      description: |
        Transizioni consentite: `IN_PREPARAZIONE→SPEDITA→CONSEGNATA`, `PROBLEMA→SPEDITA` (secondo tentativo). Da qualsiasi stato è possibile passare a `PROBLEMA`.
        Ad ogni cambio stato viene creata una notifica `CAMBIO_STATO_SPEDIZIONE` agli utenti con `spedizioni:read`.
        Richiede permesso `spedizioni:write`.
      x-required-permission: spedizioni:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SpedizioneStatoRequest' }
            example:
              stato: SPEDITA
      responses:
        "200":
          description: Stato aggiornato
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data: { $ref: '#/components/schemas/Spedizione' }
        "400": { $ref: '#/components/responses/ValidationError' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409":
          description: Transizione di stato non valida
          content:
            application/json:
              example: { status: error, code: STATE_TRANSITION_INVALID, message: Transizione di stato non valida, details: [] }

  /spedizioni/{id}/tracking:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
        example: 1
    patch:
      tags: [Spedizioni]
      summary: Aggiorna tracking number
      description: Imposta o aggiorna il numero di tracking della spedizione. Richiede permesso `spedizioni:write`.
      x-required-permission: spedizioni:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tracking_number]
              properties:
                tracking_number: { type: string, example: BRT123456789IT }
      responses:
        "200":
          description: Tracking aggiornato
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data: { $ref: '#/components/schemas/Spedizione' }
        "400": { $ref: '#/components/responses/ValidationError' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  /spedizioni/{id}/ddt:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
        example: 1
    get:
      tags: [Spedizioni]
      summary: DDT di una spedizione
      description: Restituisce il DDT collegato alla spedizione (uno per spedizione, constraint UNIQUE). Richiede permesso `spedizioni:read`.
      x-required-permission: spedizioni:read
      responses:
        "200":
          description: DDT della spedizione
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data: { $ref: '#/components/schemas/Ddt' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Spedizioni]
      summary: Crea DDT per spedizione
      description: |
        Crea il Documento di Trasporto collegato alla spedizione.
        Una spedizione può avere al massimo un DDT (unique constraint).
        Richiede permesso `spedizioni:write`.
      x-required-permission: spedizioni:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DdtCreateRequest' }
            example:
              numero_ddt: "2026/0045"
              data_ddt: "2026-06-15"
              trasportatore: "BRT Bartolini"
              note: "Consegna piano terra"
      responses:
        "201":
          description: DDT creato
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data: { $ref: '#/components/schemas/Ddt' }
        "400": { $ref: '#/components/responses/ValidationError' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409":
          description: DDT già esistente per questa spedizione
          content:
            application/json:
              example: { status: error, code: DUPLICATE_ENTRY, message: DDT già esistente per questa spedizione, details: [] }
    patch:
      tags: [Spedizioni]
      summary: Aggiorna DDT
      description: Aggiorna i campi del DDT. Tutti i campi sono opzionali. Richiede permesso `spedizioni:write`.
      x-required-permission: spedizioni:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DdtUpdateRequest' }
            example:
              note: "Consegna al primo piano"
      responses:
        "200":
          description: DDT aggiornato
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data: { $ref: '#/components/schemas/Ddt' }
        "400": { $ref: '#/components/responses/ValidationError' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  /spedizioni/{id}/ddt/pdf:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
        example: 1
    get:
      tags: [Spedizioni]
      summary: Genera PDF del DDT
      description: "Restituisce il PDF del DDT (`Content-Type: application/pdf`). Richiede permesso `spedizioni:read`."
