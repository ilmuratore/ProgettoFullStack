        Filtri opzionali via query: `stato`, `cliente_id`.
        Richiede `ordini:read`.
      x-required-permission: ordini:read
      parameters:
        - in: query
          name: stato
          schema: { type: string, enum: [BOZZA, CONFERMATO, SPEDITO, ANNULLATO] }
        - in: query
          name: cliente_id
          schema: { type: integer }
      responses:
        "200":
          description: Lista ordini
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Ordine' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Ordini]
      summary: Crea ordine di vendita
