  # ══════════════════════════════════════════
  # M08 — ORDINI DI ACQUISTO & RICEZIONI
  # ══════════════════════════════════════════

  /ordini-acquisto:
    get:
      tags: [OrdiniAcquisto]
      summary: Lista ordini di acquisto
      description: |
        Restituisce gli ordini in ordine `created_at DESC` con aggregati (totale calcolato, numero righe, totale ricevuto).
        Filtri opzionali via query: `stato` e `fornitore_id`. Richiede permesso `acquisti:read`.
      x-required-permission: acquisti:read
      parameters:
        - name: stato
          in: query
          required: false
          schema: { $ref: '#/components/schemas/StatoOrdineAcquisto' }
        - name: fornitore_id
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
          example: 3
      responses:
        "200":
          description: Lista ordini di acquisto
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/OrdineAcquistoLista' }
        "400": { $ref: '#/components/responses/ValidationError' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

    post:
      tags: [OrdiniAcquisto]
      summary: Crea ordine di acquisto
      description: |
        Crea un ordine in stato `BOZZA` con le sue righe in una transazione.
        `importo_totale` è calcolato dal server. Richiede permesso `acquisti:write`.
      x-required-permission: acquisti:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrdineAcquistoCreateRequest' }
            example:
              fornitore_id: 3
              data_prevista: "2026-06-20"
              note: "Consegna su bancali"
              utente_id: 2
              righe:
                - { prodotto_id: 7, quantita_ordinata: 100, prezzo_unitario: 12.50 }
                - { prodotto_id: 8, quantita_ordinata: 50, prezzo_unitario: 9.90 }
      responses:
        "201":
          description: Ordine creato
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data:
                    type: object
                    properties:
                      ordine: { $ref: '#/components/schemas/OrdineAcquistoLista' }
                      righe:
                        type: array
                        items: { $ref: '#/components/schemas/RigaPo' }
        "400": { $ref: '#/components/responses/ValidationError' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /ordini-acquisto/ricezioni:
    post:
      tags: [Ricezioni]
      summary: Registra ricezione su ordine
      description: |
        Registra una ricezione multi-riga su un ordine `CONFERMATO` o `IN_RICEZIONE`.
        Per ogni riga genera un movimento `CARICO_ACQUISTO`, incrementa `quantita_ricevuta` e
        aggiorna lo stato ordine a `IN_RICEZIONE` o `COMPLETATO`. Richiede permesso `acquisti:approve`.
      x-required-permission: acquisti:approve
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RicezioneOrdineCreateRequest' }
            example:
              ordine_acquisto_id: 15
              data_ricezione: "2026-06-18T11:00:00.000Z"
              note: "Ricevuto con DDT 2026-0031"
              utente_id: 2
              righe:
                - { prodotto_id: 7, quantita_ricevuta: 40, ubicazione_id: 12 }
      responses:
        "201":
          description: Ricezione registrata
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data:
                    type: object
                    properties:
                      ricezione: { $ref: '#/components/schemas/Ricezione' }
                      righe:
                        type: array
                        items: { $ref: '#/components/schemas/RigaRicezione' }
                      nuovoStatoOrdine: { $ref: '#/components/schemas/StatoOrdineAcquisto' }
        "400": { $ref: '#/components/responses/ValidationError' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409":
          description: Stato ordine incompatibile o quantità ricevuta superiore all'ordinata
          content:
            application/json:
              example:
                status: error
                code: STATE_TRANSITION_INVALID
                message: Ricezione non consentita nello stato corrente
                details: []

  /ordini-acquisto/{id}:
