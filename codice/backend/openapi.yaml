  # ══════════════════════════════════════════
  # M07 — MOVIMENTI STOCK
  # ══════════════════════════════════════════

  /movimenti-stock:
    get:
      tags: [MovimentiStock]
      summary: Lista tutti i movimenti
      description: |
        Restituisce tutti i movimenti in ordine cronologico inverso (`created_at DESC`).
        Il registro è append-only — UPDATE e DELETE sono bloccati a livello DB da RULES PostgreSQL.
        Richiede permesso `giacenze:read`.
      x-required-permission: giacenze:read
      responses:
        "200":
          description: Lista movimenti stock
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/MovimentoStock' }
              example:
                status: success
                data:
                  - id: 42
                    prodotto_id: 7
                    sku: VLV-001
                    prodotto: "Valvola a sfera 1/2\""
                    ubicazione_id: 12
                    ubicazione: "1-02-05"
                    quantita: 10
                    tipo: CARICO_ACQUISTO
                    riferimento: "ordine_acquisto:15"
                    note: null
                    created_at: "2026-06-08T10:15:00.000Z"
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

    post:
      tags: [MovimentiStock]
      summary: Registra un movimento stock
      description: |
        Crea un movimento stock e aggiorna atomicamente la giacenza nella tabella `giacenze`.
        Tutte le operazioni avvengono in una transazione `BEGIN/COMMIT`.

        ### Tipi di movimento e comportamento

        | Tipo | Effetto su giacenza | Note obbligatorie |
        |---|---|---|
        | `CARICO_ACQUISTO` | +quantita sull'ubicazione | No |
        | `SCARICO_VENDITA` | -quantita dall'ubicazione | No |
        | `RETTIFICA_POSITIVA` | +quantita sull'ubicazione | **Sì** |
        | `RETTIFICA_NEGATIVA` | -quantita dall'ubicazione | **Sì** |
        | `RESO` | +quantita sull'ubicazione | No |
        | `SPOSTAMENTO` | -quantita da `ubicazione_da_id`, +quantita su `ubicazione_a_id` | No |

        Per `SPOSTAMENTO` la risposta contiene `{ scarico, carico }` invece del singolo record.
        Per tutti gli altri tipi la risposta contiene il singolo record creato.

        Richiede permesso `giacenze:write`.
      x-required-permission: giacenze:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MovimentoStockCreateRequest' }
            examples:
              carico_acquisto:
                summary: Carico da acquisto
                value:
                  prodotto_id: 7
                  ubicazione_id: 12
                  quantita: 50
                  movimento_tipo: CARICO_ACQUISTO
                  riferimento: "ordine_acquisto:42"
              scarico_vendita:
                summary: Scarico per vendita
                value:
                  prodotto_id: 7
                  ubicazione_id: 12
                  quantita: 5
                  movimento_tipo: SCARICO_VENDITA
                  riferimento: "ordine:88"
              rettifica_positiva:
                summary: Rettifica inventariale positiva
                value:
                  prodotto_id: 7
                  ubicazione_id: 12
                  quantita: 3
                  movimento_tipo: RETTIFICA_POSITIVA
                  riferimento: "inventario:2026-Q2"
                  note: "Allineamento conteggio fisico Q2 2026"
              rettifica_negativa:
                summary: Rettifica inventariale negativa
                value:
                  prodotto_id: 7
                  ubicazione_id: 12
                  quantita: 2
                  movimento_tipo: RETTIFICA_NEGATIVA
                  riferimento: "inventario:2026-Q2"
                  note: "Scarti rilevati durante conteggio Q2 2026"
              reso:
                summary: Reso da cliente
                value:
                  prodotto_id: 7
                  ubicazione_id: 12
                  quantita: 1
                  movimento_tipo: RESO
                  riferimento: "ordine:88"
              spostamento:
                summary: Spostamento inter-slot
                value:
                  prodotto_id: 7
                  ubicazione_da_id: 12
                  ubicazione_a_id: 15
                  quantita: 20
                  movimento_tipo: SPOSTAMENTO
                  riferimento: "riorganizzazione:2026-06"
      responses:
        "201":
          description: |
            Movimento registrato. La risposta varia in base al tipo:
            - Tutti i tipi eccetto SPOSTAMENTO → `data` contiene il singolo `MovimentoStock`.
            - SPOSTAMENTO → `data` contiene `{ scarico: MovimentoStock, carico: MovimentoStock }`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data:
                    oneOf:
                      - $ref: '#/components/schemas/MovimentoStock'
                      - $ref: '#/components/schemas/SpostamentoResult'
              examples:
                carico:
                  summary: Risposta carico/scarico/rettifica/reso
                  value:
                    status: success
                    data:
                      id: 43
                      prodotto_id: 7
                      sku: VLV-001
                      prodotto: "Valvola a sfera 1/2\""
                      ubicazione_id: 12
                      ubicazione: "1-02-05"
                      quantita: 50
                      tipo: CARICO_ACQUISTO
                      riferimento: "ordine_acquisto:42"
                      note: null
                      created_at: "2026-06-08T10:30:00.000Z"
                spostamento:
                  summary: Risposta spostamento
                  value:
                    status: success
                    data:
                      scarico:
                        id: 44
                        prodotto_id: 7
                        sku: VLV-001
                        prodotto: "Valvola a sfera 1/2\""
                        ubicazione_id: 12
                        ubicazione: "1-02-05"
                        quantita: 20
                        tipo: SPOSTAMENTO
                        riferimento: "riorganizzazione:2026-06"
                        note: null
                        created_at: "2026-06-08T10:35:00.000Z"
                      carico:
                        id: 45
                        prodotto_id: 7
                        sku: VLV-001
                        prodotto: "Valvola a sfera 1/2\""
                        ubicazione_id: 15
                        ubicazione: "1-03-01"
                        quantita: 20
                        tipo: SPOSTAMENTO
                        riferimento: "riorganizzazione:2026-06"
                        note: null
                        created_at: "2026-06-08T10:35:00.000Z"
        "400": { $ref: '#/components/responses/ValidationError' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404":
          description: Prodotto o ubicazione non trovata
          content:
            application/json:
              example:
                status: error
                code: RESOURCE_NOT_FOUND
                message: Prodotto non trovato
                details: []
        "422": { $ref: '#/components/responses/InsufficientStock' }

