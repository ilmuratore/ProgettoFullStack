  /ecosystem/prodotti/{id}/disponibilita:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
        example: 7
    get:
      tags: [Ecosystem]
      summary: Disponibilità prodotto per magazzino/ubicazione
      description: |
        Giacenza dettagliata del prodotto, rigata per magazzino e ubicazione, solo dove `quantita > 0`.
        Richiede permesso `ecosystem:read`.
      x-required-permission: ecosystem:read
      responses:
        "200":
          description: Disponibilità prodotto
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DisponibilitaDettaglio' }
              example:
                status: success
                data:
                  - magazzino_id: 1
                    magazzino_codice: MAG-A
                    magazzino_nome: "Magazzino principale Sesto"
                    ubicazione_id: 12
                    ubicazione_codice: 1-02-05
                    quantita: 85
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  # ══════════════════════════════════════════
  # M16 — RICHIESTE DI ACQUISTO
  # ══════════════════════════════════════════

  /richieste-acquisto:
    get:
      tags: [RichiesteAcquisto]
      summary: Lista richieste di acquisto
      description: |
        Filtri opzionali via query: `stato`, `fornitore_id`, `utente_id`.
        Richiede permesso `acquisti:read`.
      x-required-permission: acquisti:read
      parameters:
        - name: stato
          in: query
          required: false
          schema: { $ref: '#/components/schemas/StatoRichiestaAcquisto' }
        - name: fornitore_id
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
          example: 3
        - name: utente_id
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
          example: 2
      responses:
        "200":
          description: Lista richieste
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/RichiestaAcquisto' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [RichiesteAcquisto]
      summary: Crea richiesta di acquisto
      description: |
        Crea una richiesta in stato `BOZZA`. Le righe sono opzionali alla creazione.
        Richiede permesso `acquisti:write`.
      x-required-permission: acquisti:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RichiestaAcquistoCreateRequest' }
            example:
              fornitore_id: 3
              note: "Urgente — stock sotto scorta"
              righe:
                - { prodotto_id: 7, quantita_richiesta: 50 }
                - { prodotto_id: 8, quantita_richiesta: 20 }
      responses:
        "201":
          description: Richiesta creata
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data: { $ref: '#/components/schemas/RichiestaAcquistoDettaglio' }
        "400": { $ref: '#/components/responses/ValidationError' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  /richieste-acquisto/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
        example: 5
    get:
      tags: [RichiesteAcquisto]
      summary: Dettaglio richiesta di acquisto
      x-required-permission: acquisti:read
      responses:
        "200":
          description: Dettaglio richiesta
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data: { $ref: '#/components/schemas/RichiestaAcquistoDettaglio' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [RichiesteAcquisto]
      summary: Elimina richiesta di acquisto
      description: |
        Eliminazione fisica. Consentita solo su richieste in stato `BOZZA`.
        Richiede permesso `acquisti:write`.
      x-required-permission: acquisti:write
      responses:
        "204": { $ref: '#/components/responses/NoContent' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409":
          description: Eliminazione consentita solo in stato BOZZA
          content:
            application/json:
              example: { status: error, code: INVALID_STATE, message: "Eliminazione consentita solo in stato BOZZA", details: [] }

  /richieste-acquisto/{id}/stato:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
        example: 5
    patch:
      tags: [RichiesteAcquisto]
      summary: Cambia stato richiesta
      description: |
        Macchina a stati: `BOZZA→INVIATA→IN_VALUTAZIONE→ACCETTATA|RIFIUTATA`.
        Transizioni terminali: `ACCETTATA` e `RIFIUTATA` non hanno uscite.
        Richiede permesso `acquisti:approve`.
      x-required-permission: acquisti:approve
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stato]
              properties:
                stato: { $ref: '#/components/schemas/StatoRichiestaAcquisto' }
            example:
              stato: INVIATA
      responses:
        "200":
          description: Stato aggiornato
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data: { $ref: '#/components/schemas/RichiestaAcquisto' }
        "400": { $ref: '#/components/responses/ValidationError' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409":
          description: Transizione di stato non ammessa
          content:
            application/json:
              example: { status: error, code: INVALID_TRANSITION, message: "Transizione BOZZA → ACCETTATA non ammessa", details: [] }

  /richieste-acquisto/{id}/note:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
        example: 5
    patch:
      tags: [RichiesteAcquisto]
      summary: Aggiorna note richiesta
      description: |
        Modifica le note. Consentito solo su richieste in stato `BOZZA`.
        Richiede permesso `acquisti:write`.
      x-required-permission: acquisti:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: { type: string, example: "Priorità alta — scorte in esaurimento" }
      responses:
        "200":
          description: Note aggiornate
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data: { $ref: '#/components/schemas/RichiestaAcquisto' }
        "400": { $ref: '#/components/responses/ValidationError' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409":
          description: Modifica consentita solo in stato BOZZA
          content:
            application/json:
              example: { status: error, code: INVALID_STATE, message: "Note modificabili solo in stato BOZZA", details: [] }

  /richieste-acquisto/{id}/righe:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
        example: 5
    post:
      tags: [RichiesteAcquisto]
      summary: Aggiungi riga a richiesta
      description: |
        Aggiunge una riga. Consentito solo su richieste in stato `BOZZA`.
        Richiede permesso `acquisti:write`.
      x-required-permission: acquisti:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RigaRichiestaCreateRequest' }
            example:
              prodotto_id: 9
              quantita_richiesta: 30
      responses:
        "201":
          description: Riga aggiunta
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data: { $ref: '#/components/schemas/RigaRichiesta' }
        "400": { $ref: '#/components/responses/ValidationError' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409":
          description: Righe modificabili solo in stato BOZZA
          content:
            application/json:
              example: { status: error, code: INVALID_STATE, message: "Righe modificabili solo in stato BOZZA", details: [] }

  /richieste-acquisto/{id}/righe/{riga_id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
        example: 5
      - name: riga_id
        in: path
        required: true
        schema: { type: integer }
        example: 12
    patch:
      tags: [RichiesteAcquisto]
      summary: Aggiorna quantità riga
      description: |
        Modifica `quantita_richiesta`. Consentito solo su richieste in stato `BOZZA`.
        Richiede permesso `acquisti:write`.
      x-required-permission: acquisti:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantita_richiesta]
              properties:
                quantita_richiesta: { type: integer, minimum: 1, example: 40 }
      responses:
        "200":
          description: Riga aggiornata
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data: { $ref: '#/components/schemas/RigaRichiesta' }
        "400": { $ref: '#/components/responses/ValidationError' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [RichiesteAcquisto]
      summary: Rimuovi riga da richiesta
      description: |
        Rimozione fisica della riga. Consentita solo su richieste in stato `BOZZA`.
        Richiede permesso `acquisti:write`.
      x-required-permission: acquisti:write
      responses:
        "204": { $ref: '#/components/responses/NoContent' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
