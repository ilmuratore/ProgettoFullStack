  # ══════════════════════════════════════════
  # M07 — GIACENZE
  # ══════════════════════════════════════════

  /giacenze/{prodotto_id}:
    parameters:
      - name: prodotto_id
        in: path
        required: true
        schema: { type: integer }
        example: 7

    get:
      tags: [Giacenze]
      summary: Giacenze per prodotto
      description: |
        Restituisce tutti gli slot in cui il prodotto ha giacenza,
        con nome magazzino, codice ubicazione e quantità.
        Restituisce array vuoto se il prodotto non ha ancora movimenti.
        Richiede permesso `giacenze:read`.
      x-required-permission: giacenze:read
      responses:
        "200":
          description: Lista giacenze del prodotto
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Giacenza' }
              example:
                status: success
                data:
                  - id: 23
                    prodotto_id: 7
                    sku: VLV-001
                    prodotto: "Valvola a sfera 1/2\""
                    ubicazione_id: 12
                    ubicazione: "1-02-05"
                    magazzino: "Magazzino principale Sesto"
                    quantita: 85
                  - id: 31
                    prodotto_id: 7
                    sku: VLV-001
                    prodotto: "Valvola a sfera 1/2\""
