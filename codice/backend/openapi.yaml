openapi: 3.0.3
info:
  title: LogiChain ERP — API
  version: 2.6.0
  description: 'Contratto API REST LogiChain ERP — derivato dal backend reale (migration 001–018, routes, blueprint di validazione). Tutte le rotte tranne POST /auth/login richiedono Bearer JWT. Formato risposta: { status, data } in successo, { status, code, message, details } in errore.'
servers:
  - url: /api/v1
    description: Base path API v1
tags:
  - name: Auth
  - name: Utenti
  - name: Azienda
  - name: Prodotti
  - name: Categorie
  - name: Fornitori
  - name: Clienti
  - name: Corrieri
  - name: Dipendenti
  - name: Magazzino
  - name: Giacenze
  - name: Movimenti
  - name: Ordini Acquisto
  - name: Ricezioni
  - name: Ordini Vendita
  - name: Spedizioni
  - name: Notifiche
  - name: Ecosistema
  - name: Richieste Acquisto
security:
  - BearerAuth: []
paths:
  /auth/login:
    post:
      tags:
        - Auth
      summary: Login utente
      description: Endpoint pubblico.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
                  minLength: 6
              required:
                - email
                - password
      responses:
        '200':
          description: Token JWT + profilo utente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                      utente:
                        $ref: '#/components/schemas/Utente'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/register:
    post:
      tags:
        - Auth
      summary: Registra nuovo utente (richiede utenti:write; ruoli Admin/Dev solo da Admin/Dev)
      description: 'Permesso richiesto: `utenti:write`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nome:
                  type: string
                cognome:
                  type: string
                email:
                  type: string
                password:
                  type: string
                  minLength: 6
                ruolo_id:
                  type: integer
              required:
                - nome
                - cognome
                - email
                - password
                - ruolo_id
      responses:
        '201':
          description: Creato
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /auth/me:
    get:
      tags:
        - Auth
      summary: Profilo utente corrente
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/password:
    patch:
      tags:
        - Auth
      summary: Cambio password utente corrente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password_attuale:
                  type: string
                  minLength: 6
                password_nuova:
                  type: string
                  minLength: 6
              required:
                - password_attuale
                - password_nuova
      responses:
        '204':
          description: Nessun contenuto
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /utenti:
    get:
      tags:
        - Utenti
      summary: Lista utenti
      description: 'Permesso richiesto: `utenti:read`.'
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /utenti/ruoli:
    get:
      tags:
        - Utenti
      summary: Lista ruoli
      description: 'Permesso richiesto: `utenti:read`.'
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /utenti/{id}:
    get:
      tags:
        - Utenti
      summary: Dettaglio utente
      description: 'Permesso richiesto: `utenti:read`.'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Utenti
      summary: Aggiorna utente (blocco self-deactivation e ultimo admin)
      description: 'Permesso richiesto: `utenti:write`.'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nome:
                  type: string
                cognome:
                  type: string
                email:
                  type: string
                ruolo_id:
                  type: integer
                attivo:
                  type: boolean
                dipendente_id:
                  type: integer
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags:
        - Utenti
      summary: Elimina utente (blocco self-delete e ultimo admin)
      description: 'Permesso richiesto: `utenti:delete`.'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Nessun contenuto
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /utenti/{id}/password:
    patch:
      tags:
        - Utenti
      summary: Reset password utente
      description: 'Permesso richiesto: `utenti:write`.'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password_nuova:
                  type: string
                  minLength: 6
              required:
                - password_nuova
      responses:
        '204':
          description: Nessun contenuto
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /azienda-settings:
    get:
      tags:
        - Azienda
      summary: Impostazioni azienda (emittente DDT/PDF/email)
      description: 'Permesso richiesto: `utenti:read`.'
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Azienda
      summary: Aggiorna impostazioni azienda
      description: 'Permesso richiesto: `utenti:write`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ragione_sociale:
                  type: string
                  minLength: 1
                  maxLength: 180
                piva:
                  type: string
                  maxLength: 32
                codice_fiscale:
                  type: string
                  maxLength: 32
                indirizzo:
                  type: string
                  maxLength: 255
                citta:
                  type: string
                  maxLength: 120
                provincia:
                  type: string
                  maxLength: 10
                cap:
                  type: string
                  maxLength: 10
                nazione:
                  type: string
                  maxLength: 80
                email:
                  type: string
                  maxLength: 180
                pec:
                  type: string
                  maxLength: 180
                telefono:
                  type: string
                  maxLength: 50
                sito_web:
                  type: string
                  maxLength: 180
                iban:
                  type: string
                  maxLength: 64
                sdi:
                  type: string
                  maxLength: 16
                logo_url:
                  type: string
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /prodotti:
    get:
      tags:
        - Prodotti
      summary: Listino prodotti attivi
      description: 'Permesso richiesto: `prodotti:read`.'
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Prodotti
      summary: Crea prodotto
      description: 'Permesso richiesto: `prodotti:write`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nome:
                  type: string
                sku:
                  type: string
                descrizione:
                  type: string
                prezzo:
                  type: number
                  minimum: 0.01
                categoria_id:
                  type: integer
                  minimum: 1
                unita_misura:
                  type: string
                peso_kg:
                  type: number
                  minimum: 0
                scorta_minima:
                  type: integer
                  minimum: 0
                attivo:
                  type: boolean
              required:
                - nome
                - sku
                - prezzo
      responses:
        '201':
          description: Creato
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /prodotti/import/template:
    get:
      tags:
        - Prodotti
      summary: Scarica template CSV import
      description: 'Permesso richiesto: `prodotti:write`.'
      responses:
        '200':
          description: File generato
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /prodotti/import:
    post:
      tags:
        - Prodotti
      summary: Import massivo prodotti (CSV/XLSX)
      description: 'Permesso richiesto: `prodotti:write`.'
      responses:
        '200':
          description: Esito import
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    type: object
                    properties:
                      importati:
                        type: integer
                      saltati:
                        type: integer
                      errori:
                        type: array
                        items:
                          type: object
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /prodotti/{id}:
    get:
      tags:
        - Prodotti
      summary: Dettaglio prodotto
      description: 'Permesso richiesto: `prodotti:read`.'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Prodotti
      summary: Aggiorna prodotto
      description: 'Permesso richiesto: `prodotti:write`.'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nome:
                  type: string
                sku:
                  type: string
                descrizione:
                  type: string
                prezzo:
                  type: number
                  minimum: 0.01
                categoria_id:
                  type: integer
                  minimum: 1
                unita_misura:
                  type: string
                peso_kg:
                  type: number
                  minimum: 0
                scorta_minima:
                  type: integer
                  minimum: 0
                attivo:
                  type: boolean
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags:
        - Prodotti
      summary: Soft delete prodotto
      description: 'Permesso richiesto: `prodotti:delete`.'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Nessun contenuto
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /categorie:
    get:
      tags:
        - Categorie
      summary: Lista categorie
      description: 'Permesso richiesto: `prodotti:read`.'
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Categorie
      summary: Crea categoria
      description: 'Permesso richiesto: `prodotti:write`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nome:
                  type: string
                  minLength: 1
                categoria_padre_id:
                  type: integer
                  minimum: 1
              required:
                - nome
      responses:
        '201':
          description: Creato
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /categorie/{id}:
    get:
      tags:
        - Categorie
      summary: Dettaglio categoria
      description: 'Permesso richiesto: `prodotti:read`.'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Categorie
      summary: Aggiorna categoria
      description: 'Permesso richiesto: `prodotti:write`.'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nome:
                  type: string
                  minLength: 1
                categoria_padre_id:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags:
        - Categorie
      summary: Elimina categoria (blocco se ha prodotti/sottocategorie)
      description: 'Permesso richiesto: `prodotti:delete`.'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Nessun contenuto
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /fornitori:
    get:
      tags:
        - Fornitori
      summary: Lista fornitori attivi
      description: 'Permesso richiesto: `fornitori:read`.'
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Fornitori
      summary: Crea fornitore (source forzato a manual)
      description: 'Permesso richiesto: `fornitori:write`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ragione_sociale:
                  type: string
                piva:
                  type: string
                indirizzo:
                  type: string
                email:
                  type: string
                telefono:
                  type: string
                sito_web:
                  type: string
                descrizione_aziendale:
                  type: string
              required:
                - ragione_sociale
