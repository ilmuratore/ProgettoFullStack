  # ══════════════════════════════════════════
  # M06 — MAGAZZINI
  # ══════════════════════════════════════════

  /magazzini:
    get:
      tags: [Magazzini]
      summary: Lista magazzini
      description: Restituisce tutti i magazzini inclusi i disattivi (management view).
      x-required-permission: magazzino:read
      responses:
        "200":
          description: Lista magazzini
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Magazzino' }
              example:
                status: success
                data:
                  - id: 1
                    codice: MAG-A
                    nome: "Magazzino principale Sesto"
                    indirizzo: "Via dell'Artigianato 14"
                    cap: "20099"
                    citta: "Sesto San Giovanni"
                    provincia: MI
                    paese: Italia
                    attivo: true
                    created_at: "2026-01-10T08:00:00.000Z"
                    updated_at: "2026-01-10T08:00:00.000Z"
                  - id: 2
                    codice: MAG-B
                    nome: "Magazzino secondario Monza"
                    indirizzo: "Via Borgazzi 45"
                    cap: "20900"
                    citta: Monza
                    provincia: MB
                    paese: Italia
                    attivo: false
                    created_at: "2026-02-01T08:00:00.000Z"
                    updated_at: "2026-05-10T12:00:00.000Z"
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

    post:
      tags: [Magazzini]
      summary: Crea un nuovo magazzino
      description: |
        `codice` deve essere univoco e non è modificabile dopo la creazione.
      x-required-permission: magazzino:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MagazzinoCreateRequest' }
            example:
              codice: MAG-C
              nome: "Deposito Cologno"
              indirizzo: "Via Edison 3"
              cap: "20093"
              citta: "Cologno Monzese"
              provincia: MI
              paese: Italia
      responses:
        "201":
          description: Magazzino creato
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data:   { $ref: '#/components/schemas/Magazzino' }
              example:
                status: success
                data:
                  id: 3
                  codice: MAG-C
                  nome: "Deposito Cologno"
                  indirizzo: "Via Edison 3"
                  cap: "20093"
                  citta: "Cologno Monzese"
                  provincia: MI
                  paese: Italia
                  attivo: true
                  created_at: "2026-06-07T16:00:00.000Z"
                  updated_at: "2026-06-07T16:00:00.000Z"
        "400": { $ref: '#/components/responses/ValidationError' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409": { $ref: '#/components/responses/DuplicateEntry' }

  /magazzini/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
        example: 1

    get:
      tags: [Magazzini]
      summary: Dettaglio magazzino con ubicazioni
      description: |
        Restituisce il magazzino con l'albero completo delle ubicazioni.
        Ogni ubicazione include `totale_giacenza` (somma delle giacenze nello slot).
      x-required-permission: magazzino:read
      responses:
        "200":
          description: Dettaglio magazzino con ubicazioni
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data:   { $ref: '#/components/schemas/MagazzinoConUbicazioni' }
              example:
                status: success
                data:
                  id: 1
                  codice: MAG-A
                  nome: "Magazzino principale Sesto"
                  indirizzo: "Via dell'Artigianato 14"
                  cap: "20099"
                  citta: "Sesto San Giovanni"
                  provincia: MI
                  paese: Italia
                  attivo: true
                  created_at: "2026-01-10T08:00:00.000Z"
                  updated_at: "2026-01-10T08:00:00.000Z"
                  ubicazioni:
                    - id: 1
                      magazzino_id: 1
                      corsia: 1
                      scaffale: 1
                      codice: 1-01-01
                      codice_composto: "MAG-A / 1-01-01"
                      attivo: true
                      temperatura_controllata: false
                      totale_giacenza: 250
                      created_at: "2026-01-10T08:00:00.000Z"
                      updated_at: "2026-01-10T08:00:00.000Z"
                    - id: 2
                      magazzino_id: 1
                      corsia: 1
                      scaffale: 2
                      codice: 1-01-02
                      codice_composto: "MAG-A / 1-01-02"
                      attivo: true
                      temperatura_controllata: true
                      totale_giacenza: 0
                      created_at: "2026-01-10T08:00:00.000Z"
                      updated_at: "2026-01-10T08:00:00.000Z"
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

    patch:
      tags: [Magazzini]
      summary: Aggiorna magazzino
      description: |
        Aggiorna `nome` e/o `indirizzo`. `codice` non è modificabile.
      x-required-permission: magazzino:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MagazzinoUpdateRequest' }
            example:
              nome: "Magazzino principale Sesto — ampliato"
      responses:
        "200":
          description: Magazzino aggiornato
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data:   { $ref: '#/components/schemas/Magazzino' }
        "400": { $ref: '#/components/responses/ValidationError' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  /magazzini/{id}/toggle:
    patch:
      tags: [Magazzini]
      summary: Toggle attivo/disattivo magazzino
      description: Inverte il valore del campo `attivo`. Nessun body richiesto.
      x-required-permission: magazzino:write
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
          example: 2
      responses:
        "200":
          description: Stato aggiornato
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data:   { $ref: '#/components/schemas/Magazzino' }
              example:
                status: success
                data:
                  id: 2
                  codice: MAG-B
                  nome: "Magazzino secondario Monza"
                  indirizzo: "Via Borgazzi 45"
                  cap: "20900"
                  citta: Monza
                  provincia: MB
                  paese: Italia
                  attivo: true
                  created_at: "2026-02-01T08:00:00.000Z"
                  updated_at: "2026-06-07T16:30:00.000Z"
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  /magazzini/{magId}/ubicazioni:
    post:
      tags: [Ubicazioni]
      summary: Crea una nuova ubicazione in un magazzino
      description: |
        Rotta nested sotto `/magazzini/:magId/ubicazioni`.
        Il `codice` dell'ubicazione viene calcolato e storato automaticamente dal service.
        La combinazione `(corsia, scaffale)` deve essere univoca nel magazzino.
      x-required-permission: magazzino:write
      parameters:
        - name: magId
          in: path
          required: true
          schema: { type: integer }
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UbicazioneCreateRequest' }
            example:
              corsia: 3
              scaffale: 7
              temperatura_controllata: false
      responses:
        "201":
          description: Ubicazione creata
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data:   { $ref: '#/components/schemas/Ubicazione' }
              example:
                status: success
                data:
                  id: 15
                  magazzino_id: 1
                  corsia: 3
                  scaffale: 7
                  codice: 1-03-07
                  codice_composto: "MAG-A / 1-03-07"
                  attivo: true
                  temperatura_controllata: false
                  created_at: "2026-06-07T16:45:00.000Z"
                  updated_at: "2026-06-07T16:45:00.000Z"
        "400": { $ref: '#/components/responses/ValidationError' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404":
          description: Magazzino non trovato
          content:
            application/json:
              example:
                status: error
                code: RESOURCE_NOT_FOUND
                message: Magazzino non trovato
                details: []
        "409":
          description: Slot già occupato (stessa corsia+scaffale nel magazzino)
          content:
            application/json:
              example:
                status: error
                code: DUPLICATE_ENTRY
                message: "Ubicazione corsia 3 scaffale 7 già esistente in questo magazzino"
                details: []

