components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        status:
          type: string
          example: error
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object
    Utente:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        cognome:
          type: string
        email:
          type: string
        ruolo_id:
          type: integer
        ruolo:
          type: string
        attivo:
          type: boolean
  responses:
    Unauthorized:
      description: Autenticazione richiesta
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: error
            code: AUTH_REQUIRED
            message: Autenticazione richiesta
            details: []
    Forbidden:
      description: Accesso negato
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: error
            code: ACCESS_DENIED
            message: Accesso negato
            details: []
    NotFound:
      description: Risorsa non trovata
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: error
            code: RESOURCE_NOT_FOUND
            message: Risorsa non trovata
            details: []
    Conflict:
      description: Conflitto o transizione di stato non consentita
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: error
            code: DUPLICATE_ENTRY
            message: Conflitto o transizione di stato non consentita
            details: []
    ValidationError:
      description: Dati richiesta non validi
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: error
            code: VALIDATION_ERROR
            message: Dati richiesta non validi
            details: []
    Unprocessable:
      description: Operazione non processabile (es. stock insufficiente)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: error
            code: INSUFFICIENT_STOCK
            message: Operazione non processabile (es. stock insufficiente)
            details: []
    Deprecated:
      description: Endpoint deprecato
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: error
            code: ENDPOINT_DEPRECATED
            message: Endpoint deprecato
            details: []
